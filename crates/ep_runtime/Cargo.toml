[package]
name = "ep_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ep_model = { path = "../ep_model" }
ep_platform_math = { path = "../ep_platform_math" }

[dev-dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[lints]
workspace = true


[features]
native-controlled-air-cohort = []

[[test]]
name = "native_controlled_air_cohort"
path = "src/lib.rs"
harness = false
required-features = ["native-controlled-air-cohort"]
