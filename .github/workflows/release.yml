name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify portable package and publish
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release identity
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
              throw "Expected vMAJOR.MINOR.PATCH: $tag"
          }
          $version = $tag.Substring(1)
          $gate = "v$($Matches.major).$($Matches.minor)-verify"
          $notes = "docs/src/releases/$tag.md"
          if (-not (Test-Path -LiteralPath "scripts/release/$gate.ps1") -or
              -not (Test-Path -LiteralPath $notes)) {
              throw "Missing verification gate or release notes for $tag"
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_GATE=$gate" >> $env:GITHUB_ENV
          "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV
          "RELEASE_ARTIFACT=dist/eplus-rs-$tag-windows-x64.zip" >> $env:GITHUB_ENV

      - name: Set up Python for documentation checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy

      - name: Locate GNU linker
        run: |
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          $compilerPath = if ($null -ne $gcc) { $gcc.Source } else { $null }
          if ($null -eq $compilerPath) {
              foreach ($folder in @('C:\mingw64\bin', 'C:\msys64\ucrt64\bin', 'C:\msys64\mingw64\bin')) {
                  if (Test-Path -LiteralPath "$folder\gcc.exe") {
                      $folder >> $env:GITHUB_PATH
                      $compilerPath = "$folder\gcc.exe"
                      break
                  }
              }
          }
          if ($null -eq $compilerPath) { throw 'The pinned Windows GNU toolchain needs a MinGW-w64 linker.' }
          & $compilerPath --version

      - name: Obtain locked reference runtime and sample weather
        run: .\scripts\dev.cmd setup -SkipPythonSetup -SkipPythonSmoke -SkipSourceDownload -SkipOracleSmoke

      - name: Check formatting and workspace regression tests
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace --lib --bins --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the actual extracted package
        run: .\scripts\dev.cmd $env:RELEASE_GATE

      - name: Publish bounded-scope prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .\scripts\dev.cmd github-release -Tag $env:RELEASE_TAG -Version $env:RELEASE_VERSION -Repo $env:GITHUB_REPOSITORY -Artifact $env:RELEASE_ARTIFACT -NotesFile $env:RELEASE_NOTES
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
