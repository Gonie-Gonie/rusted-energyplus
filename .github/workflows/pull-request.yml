name: Pull Request Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-cross-check:
    name: Spec Cross-Check
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cross-check capability, algorithm, case, and variable specs
        run: .\scripts\dev.cmd spec-cross-check -SelfTest

      - name: Gate full-domain claims on routine completion
        run: .\scripts\dev.cmd project-contract-check -SelfTest

      - name: Verify generated routine readiness docs
        run: python tools/docs/generate_docs.py --repo-root . --check

      - name: Fetch locked EnergyPlus source subset
        run: |
          python tools/docs/fetch_energyplus_reference_subset.py --repo-root . --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/docs/fetch_energyplus_reference_subset.py --repo-root . --force

      - name: Validate source-order routine evidence
        run: |
          .\scripts\dev.cmd algorithm-ledger-check
          .\scripts\dev.cmd algorithm-ledger-check -SelfTest

  algorithm-port-ticket:
    name: Algorithm Port Ticket
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Algorithm Port Ticket
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          $bodyPath = Join-Path $env:RUNNER_TEMP "pull-request-body.md"
          Set-Content -Encoding UTF8 -LiteralPath $bodyPath -Value $env:PR_BODY
          .\scripts\dev.cmd pr-port-ticket-check -BodyPath $bodyPath -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA
