id = "window_glazing_equivalent_layer_001"
title = "Equivalent-layer window glazing static material evidence"
milestone = "v0.8-heat-balance"
purpose = "Compare the bounded Rust WindowMaterial:Glazing:EquivalentLayer typed slice with EnergyPlus equivalent-layer material EIO evidence while locking oracle-only construction and fenestration fixture use."
comparison_class = "smoke"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "The fixture assigns one complete, explicit-numeric equivalent-layer glazing material to a one-solid-layer Construction:WindowEquivalentLayer and an actual FenestrationSurface:Detailed on a distinct opaque host wall.",
  "The one-solid-layer construction intentionally needs no equivalent-layer gap, shade, drape, blind, or screen dependency.",
  "The dedicated EnergyPlus EIO row contains the material identity fields and 14 numeric solar/infrared fields. Rust compares all of those emitted values.",
  "The 11 visible optical inputs and thermal resistance remain typed-only because EnergyPlus omits them from this EIO row.",
  "EnergyPlus ignores the optional spectral dataset input for the supported SpectralAverage mode and emits a blank dataset field; this fixture leaves that input blank and makes no preservation claim.",
  "The exact Construction:WindowEquivalentLayer row and host/window HeatTransfer Surface rows are oracle-only fixture-integrity locks. Its layer count is the solid-layer count, while U-factor, SHGC, and solar transmittance are EnergyPlus-derived ratings.",
  "EnergyPlus emits equivalent-layer material rows per construction-layer occurrence; the Rust bridge validates every oracle occurrence by material identity while construction occurrence parity remains unclaimed.",
  "This is non-blocking diagnostic-only static input evidence. It makes no claim for Construction:WindowEquivalentLayer typing, ASHWAT optics, ratings, fenestration runtime, dynamic heat transfer, or conformance.",
]

[manifest_v2]
schema = "rusted-energyplus.case-manifest.v2"
source_kind = "local-fixture"
source_file = "data/conformance_cases/window_glazing_equivalent_layer_001/window_glazing_equivalent_layer.idf"
tier = "A"

[scope]
domains = ["zone", "surface", "construction"]
has_zone = true
has_surface = true
has_fenestration = true
has_air_loop = false
has_plant_loop = false
has_ems = false
has_python_plugin = false
has_daylighting = false

[input]
idf = "data/conformance_cases/window_glazing_equivalent_layer_001/window_glazing_equivalent_layer.idf"
