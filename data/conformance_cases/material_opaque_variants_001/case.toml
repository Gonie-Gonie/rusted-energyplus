id = "material_opaque_variants_001"
title = "Opaque material variant EIO layer ordering"
milestone = "v0.8-heat-balance"
purpose = "Compare Rust Regular, AirGap, and InfraredTransparent construction-layer interpretation with EnergyPlus construction-grouped EIO rows."
comparison_class = "smoke"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "The MIXED OPAQUE construction deliberately places two consecutive Material:AirGap layers between regular solid outside and inside layers.",
  "The reciprocal surface uses MIXED OPAQUE REVERSE so the asymmetric solid and gap properties appear in physically reversed layer order.",
  "The IRT ONLY construction deliberately uses Material:InfraredTransparent as its sole layer on a paired interzone surface.",
  "All three variant constructions are assigned across two reciprocal BuildingSurface:Detailed interzone pairs so EnergyPlus validates their intended use.",
  "The smoke gate groups every Construction CTF row with all emitted material summary rows and fails construction-count, layer-count, material-name, outside-to-inside order, or thermal-resistance mismatches.",
  "This remains non-blocking diagnostic evidence for the exact static fixture. It does not claim dynamic air-gap heat transfer, IRT interzone warning parity, CondFD behavior, general construction or conduction behavior, or material-family conformance.",
]

[manifest_v2]
schema = "rusted-energyplus.case-manifest.v2"
source_kind = "local-fixture"
