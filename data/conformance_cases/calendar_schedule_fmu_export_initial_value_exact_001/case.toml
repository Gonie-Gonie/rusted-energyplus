notes = [
  "The fixture is one non-actual 2032-01-01 Thursday RunPeriod with Timestep,4, all six RunPeriod weather/calendar policies set to No, and a synthetic 24-row EPW with no holidays or daylight saving.",
  "One ExternalInterface:FunctionalMockupUnitExport:To:Schedule has inner schedule_name FMU Export Initial Value, reported through the normalized Schedule Value key FMU EXPORT INITIAL VALUE, references ScheduleTypeLimits Any Number, retains ProbeInput as inert FMU variable metadata, and declares Initial Value 0.875. No ExternalInterface activation object or socket/provider configuration is present, so EnergyPlus retains that initial value and emits its missing-activation warning exactly once.",
  "The zero-tolerance external claim is exactly 96 ordered, unique Timestep Schedule Value samples and timestamps, each equal to 0.875. The gate also locks all raw EnergyPlus ESO values and timestamp fields.",
  "Converted epJSON must retain exactly one family member under the synthetic outer key ExternalInterface:FunctionalMockupUnitExport:To:Schedule 1; its actual schedule identity remains the inner schedule_name FMU Export Initial Value beside schedule_type_limits_names Any Number, fmu_variable_name ProbeInput, and initial_value 0.875. No ExternalInterface activation family is present. Exact Environment and disabled-daylight-saving EIO rows plus the one-warning successful ERR and END completion records are also locked.",
  "socket.cfg and variables.cfg handling, provider resolution, FMU variable binding, live exchange, warmup handoff, mutable updates or currentVal state, termination or final exchange, Ptolemy lifecycle, global ExternalInterface behavior, other ExternalInterface variable or actuator families, exact duplicate diagnostic text, bounded ScheduleTypeLimits parity, unknown type-limit warning parity, downstream consumers, multiple objects, actual/design-day/multi-environment execution, and Rust raw ESO serialization remain outside the claim.",
]

