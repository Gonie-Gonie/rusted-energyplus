id = "calendar_dst_epw_idf_precedence_hourly_exact_001"
title = "EPW versus input-file daylight-saving precedence exact"
milestone = "full-source-order-calendar-dst-epw-idf-precedence"
purpose = "Block on the exact EnergyPlus precedence of one input-file fixed-date daylight-saving object over a declared but RunPeriod-disabled EPW period."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "This case reuses the disabled fixed-date policy IDF and its leap-observed EPW; the only IDF addition is one RunPeriodControl:DaylightSavingTime object declaring 2/28 through 2/29.",
  "The EPW declares 2/29 through 3/1 while the RunPeriod explicitly sets Use Weather File Daylight Saving Period to No. The input-file object takes precedence independently of that flag, proving daily states 1, 1, and 0 with exactly 48 active hours.",
  "External evidence is limited to 72 ordered, unique raw EnergyPlus ESO values and timestamp fields, the exact EnergyPlus 26.1 Environment and Environment:Daylight Saving rows, and clean 0 Warning and 0 Severe completion for this one fixed-date precedence fixture.",
  "The Rust weather-file declaration, RunPeriod-use, input-file declaration, active-state, effective-source, resolved-period, and active-sample fields are locked summary diagnostics; they are not additional fields emitted by the EnergyPlus EIO rows.",
  "Blank, omitted, defaulted, duplicate, or invalid input-file objects; other fixed dates or date rules; southern or year-wrapping ranges; weather-file enablement with an input-file object; no-EPW execution; and multiple RunPeriods remain outside this claim.",
  "Actual-weather and cross-year execution; DST-shifted schedule lookup; hour-24, tomorrow-state, or civil-clock transitions; holidays and weekend observation; Rust raw ESO serialization; broad WeatherManager compatibility; and other output variables remain outside this claim.",
]

