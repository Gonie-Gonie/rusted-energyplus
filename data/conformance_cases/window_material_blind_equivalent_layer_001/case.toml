id = "window_material_blind_equivalent_layer_001"
title = "Equivalent-layer window blind static definition and occurrence evidence"
milestone = "v0.8-heat-balance"
purpose = "Compare the bounded WindowMaterial:Blind:EquivalentLayer typed slice with EnergyPlus generic definition and equivalent-layer construction occurrence EIO evidence."
comparison_class = "smoke"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "The fixture defines three WindowMaterial:Blind:EquivalentLayer objects in explicit source order Z, M, A: one negative-angle high-precision blind reused by two equivalent-layer constructions, one valid unused blind, and one defaulted blind used by a surface-unused construction.",
  "Construction:WindowEquivalentLayer declarations use canonical source order A, B, C and the tested five-layer Glass/Gap/Glass/Gap/Blind shape. A contains the defaulted blind, while B and C contain the same high-precision Z definition; the exact specialized occurrence sequence is therefore A, Z, Z.",
  "Two FenestrationSurface:Detailed windows share construction B, but B emits one specialized Z occurrence. Construction C has no surface but emits the second Z occurrence. Fixture-only EnergyManagementSystem:ConstructionIndexVariable objects reference surface-unused constructions A and C solely to avoid nominally-unused-construction warnings.",
  "The generic Material Details table echoes all three definitions exactly once in source order Z, M, A, including unused M, with canonical name, Rough roughness, and zero resistance, thickness, conductivity, density, specific heat, and thermal, solar, and visible absorptance fields.",
  "The specialized header has 18 comma-separated tokens, including source typos that say Slate and a final Slat Angle Control label, while every specialized payload has only 17 tokens because EnergyPlus omits the angle-control value.",
  "EnergyPlus 26.1 emits no newline after a Blind:EquivalentLayer payload. A is concatenated with the following Construction B row, the first Z with Construction C, and the final Z directly with the next EIO header. The bounded parser must recover those logical record boundaries without normalizing the oracle artifact.",
  "Every specialized numeric value uses source {:.5R} serialization. A locks blank orientation/crown/angle defaults plus zero defaulted beam transmittances, solar diffuse state, and infrared state while preserving its required beam-diffuse reflectances. Z locks a distinctive negative angle, high-precision geometry and optics, and byte-identical duplicate reuse; visible inputs and angle control are absent from the EIO payload.",
  "The primary oracle lane requests Constructions and Materials and emits both generic and specialized tables. The Materials-only lane retains generic Z, M, A rows while omitting equivalent-layer construction and specialized rows. The Constructions-only lane retains construction and specialized A, Z, Z rows while omitting generic Material Details.",
  "The gate requires clean EnergyPlus 26.1.0 completion for all three lanes, converted epJSON artifacts, exact malformed headers and concatenated logical rows, exact definition and occurrence order, inclusion of unused M only in generic output, the expected reporting activation boundaries, and passing bounded Rust comparisons in explicit exact mode.",
  "The bounded Rust comparison covers typed definitions and parsed static EIO rows only. This remains non-blocking diagnostic evidence and makes no Rust EIO serializer, equivalent-layer construction packing, CheckAndFixCFSLayer, ASHWAT optics/thermal, rating, surface behavior, runtime, broad diagnostic-text, or conformance claim.",
]

