id = "calendar_schedule_compact_zone_timestep_exact_001"
title = "Schedule:Compact zone-timestep lookup without interpolation"
milestone = "full-source-order-schedule-compact-zone-timestep"
purpose = "Block on exact EnergyPlus ScheduleDetailed::getHrTsVal timestep indexing after a Schedule:Compact day profile is populated without interpolation."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "The explicit one-day non-actual RunPeriod uses Timestep,4 with daylight saving and special days disabled. The Schedule:Compact profile has four aligned 15-minute Until boundaries in hour 1 and one final boundary at 24:00.",
  "The zero-tolerance external claim is exactly 96 ordered, unique Timestep Schedule Value samples and timestamps: 11, 12, 13, and 14 for hour 1 timesteps 1 through 4, followed by 90 for the remaining 92 zone timesteps.",
  "This case proves the default Interpolate:No path for aligned Schedule:Compact minute fields, DaySchedule::populateFromMinuteVals end-minute sampling, and ScheduleDetailed::getHrTsVal explicit timestep indexing for one four-timestep-per-hour environment.",
  "An explicit Interpolate:No directive, Interpolate:Average, Interpolate:Linear, non-aligned Until warnings, timestep-count correction, daylight-saving interaction with subhourly lookup, other schedule families, Schedule:File, EMS actuation, a Rust currentVal store, UpdateScheduleVals orchestration, downstream HVAC consumption, and broad warning/error parity remain outside the claim.",
]

