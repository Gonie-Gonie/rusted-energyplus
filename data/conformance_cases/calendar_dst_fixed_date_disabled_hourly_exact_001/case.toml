  "Blank, omitted, defaulted, or invalid policy tokens; other fixed dates or date rules; southern or year-wrapping ranges; IDF RunPeriodControl:DaylightSavingTime and EPW-versus-IDF precedence; and multiple RunPeriods remain outside this claim.",
