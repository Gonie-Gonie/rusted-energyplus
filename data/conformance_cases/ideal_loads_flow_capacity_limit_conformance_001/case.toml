id = "ideal_loads_flow_capacity_limit_conformance_001"
title = "One-zone no-OA IdealLoads flow-and-capacity-limit conformance"
milestone = "ideal-loads-finite-limit-conformance"
purpose = "Claim narrow no-outdoor-air IdealLoads sensible numerical conformance when numeric heating and cooling flow-rate and capacity limits are active together."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "This case claims only the declared no-OA flow-and-capacity-limit IdealLoads sensible conformance outputs.",
  "The boundary excludes outdoor air, economizer, heat recovery, humidistats, DCV, autosizing, air loops, plant loops, EMS, and PythonPlugin.",
  "Numeric heating and cooling flow-rate and capacity limits are active together.",
  "IdealLoads rate and node comparisons use Detailed output to avoid false deltas from zone-timestep averaging of nonlinear mass-flow formulas.",
  "Zone System Predicted Sensible Load to Setpoint is the active signed demand input; heating/cooling setpoint loads remain diagnostic proof inputs for ZoneSysEnergyDemand.",
  "Mass-flow comparison uses the EnergyPlus same-call return-node recirculation state for finite-limit no-OA mixed-air and report calculations.",
  "Return-node and humidity-ratio rows remain diagnostic proof rows; broad node and humidity conformance remain outside the claim."
]

[trace]
level = "default-conformance"

