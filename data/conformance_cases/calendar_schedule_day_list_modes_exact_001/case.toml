id = "calendar_schedule_day_list_modes_exact_001"
title = "Schedule:Day:List interpolation modes through Week:Daily and Year"
milestone = "full-source-order-schedule-day-list-modes"
purpose = "Block on exact EnergyPlus Schedule:Day:List default-No, Average, and version-26.1 source-actual Linear zone-timestep semantics through one typed Schedule:Week:Daily and Schedule:Year chain."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "The fixture is one non-actual 2032-01-01 through 2032-01-03 Thursday-start RunPeriod with Timestep,4, all six RunPeriod weather/calendar policies set to No, and a synthetic 72-row EPW with no daylight saving or holidays.",
  "Three Schedule:Day:List profiles each use Minutes per Item 20 and exactly 72 source-ordered values: 10, 70, 160, then 69 values of 175. They are selected by one Schedule:Week:Daily and full-year Schedule:Year chain: Thursday uses a genuinely blank Interpolate to Timestep field whose EnergyPlus schema default is No, Friday uses Average, and Saturday uses Linear.",
  "The zero-tolerance claim is exactly one 288-sample ordered, unique Timestep Schedule Value series and its timestamps. Thursday default-No is [10, 70, 160, 160] then 92 values of 175; Friday Average is [10, 50, 100, 160] then 92 values of 175; Saturday EnergyPlus 26.1 source-actual Linear is [10, 70, 160, 160] then 92 values of 175.",
  "The Linear claim deliberately records EnergyPlus 26.1 source-actual behavior for this Schedule:Day:List shape, which equals No. Intended or documented Linear ramp semantics are not claimed.",
  "The EnergyPlus oracle completes with exactly 0 Warning and 0 Severe errors.",
  "This case consumes only Thursday, Friday, and Saturday from Schedule:Week:Daily and one full-year Schedule:Year range. Other day types, Year ranges, missing, overlap, wrap, and reference diagnostics remain outside the claim.",
  "Schedule:Week:Compact, other Minutes per Item values, other timestep counts, malformed value counts or fields, Hourly aggregation, and broad input diagnostic parity remain outside the claim.",
  "Daylight-saving, holidays, today/tomorrow rollover, actual-weather, design-day, warmup, multiple environments, downstream schedule consumption, UpdateScheduleVals orchestration, EMS override behavior, and currentVal state remain outside the claim.",
  "Rust raw ESO serialization, Rust EPW record selection, and broad EnergyPlus warning/error parity remain outside the claim.",
]

