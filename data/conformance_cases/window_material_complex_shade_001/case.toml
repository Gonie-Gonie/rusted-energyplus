  "The smoke gate generates and verifies all four Output:Constructions selector variants, converted epJSON artifacts, exact oracle rows and selector shapes, and the bounded Rust command `compare window-material-complex-shade` in explicit exact mode.",
  "Layer classification, infrared transmittance, front emissivity, openings, slat geometry, slat-angle or curve validation outside the accepted fixture values, complex-fenestration construction use, TARCOG or WCE behavior, ratings, daylighting, surfaces, runtime, diagnostics, and broad declaration-order behavior remain outside this evidence.",
