  "The both-selector and Materials-only lanes each emit exactly one generic Material Details header, one empty Material:Air header, and exactly seven target rows in fixture-local source IDF order Z, Y, X, W, V, U, T. Constructions-only and blank/default-selector lanes emit no generic target header or data.",
  "Each exact eleven-token target row locks normalized identity, zero thermal resistance, Rough roughness, source thickness and conductivity, zero density and specific heat, the source back emissivity projected as thermal absorptance, and zero solar and visible absorptance. The generic row does not expose layer type, front emissivity, infrared transmittance, openings, slat state, or curve geometry.",
  "The both-selector and Constructions-only lanes each emit exactly the four empty Construction CTF, Material CTF Summary, Material:Air CTF Summary, and CTF headers. Materials-only and blank/default-selector lanes emit none of those CTF headers; all four lanes emit no CTF data row for this no-construction fixture.",
  "No lane emits a dedicated WindowMaterial:ComplexShade, WindowMaterial:Glazing, or WindowConstruction header or data row. Every lane completes with zero warnings and zero severe errors.",
