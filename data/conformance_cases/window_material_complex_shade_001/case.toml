  "The warning-free no-zone fixture defines exactly seven unused WindowMaterial:ComplexShade objects in source IDF order Z, Y, X, W, V, U, T. It contains no Construction, Construction:ComplexFenestrationState, Zone, BuildingSurface:Detailed, or FenestrationSurface:Detailed object.",
