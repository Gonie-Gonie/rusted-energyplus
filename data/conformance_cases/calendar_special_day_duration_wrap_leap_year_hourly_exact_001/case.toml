id = "calendar_special_day_duration_wrap_leap_year_hourly_exact_001"
title = "Leap-year duration-three special-day annual-table wrap"
milestone = "full-source-order-calendar-special-day-duration-wrap"
purpose = "Block on exact ordered hourly day types when one 12/31 duration-three input-file Holiday wraps through the leap-year annual day-type table."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "The claim is limited to 72 ordered, unique hour-ending Site Day Type Index samples from the explicit 2016-01-01 through 2016-01-03 RunPeriod.",
  "The exact 12/31 duration-three Holiday resolves at leap-year day-of-year 366 and populates the same year's cyclic annual day-type table across its boundary, producing 48 Holiday index-8 samples followed by 24 Sunday index-1 samples.",
  "The independent 72-row EPW observes leap years as Yes and declares no holidays or daylight-saving period; the RunPeriod explicitly disables every weather-file, daylight-saving, weekend, rain, snow, and actual-weather policy.",
  "This is same-year cyclic annual-table wrap, not a cross-year RunPeriod; overlap, definition order, precedence, warnings, other durations, dates, day types, policies, EPW calendar inputs, and cross-year traversal remain outside this claim.",
]

