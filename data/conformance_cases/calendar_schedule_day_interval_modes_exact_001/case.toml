id = "calendar_schedule_day_interval_modes_exact_001"
title = "Schedule:Day:Interval interpolation modes through Week:Daily and Year"
milestone = "full-source-order-schedule-day-interval-modes"
purpose = "Block on exact EnergyPlus Schedule:Day:Interval default-No, Average, and Linear zone-timestep semantics through one typed Schedule:Week:Daily and Schedule:Year chain."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "The fixture is one non-actual 2032-01-01 through 2032-01-03 Thursday-start RunPeriod with Timestep,4, all six RunPeriod weather/calendar policies set to No, and a synthetic 72-row EPW with no daylight saving or holidays.",
  "Three Schedule:Day:Interval profiles are selected by one Schedule:Week:Daily and full-year Schedule:Year chain: Thursday uses a genuinely blank Interpolate to Timestep field whose EnergyPlus schema default is No with aligned Until: 00:15 value 10 then Until: 24:00 value 175; Friday uses Average and Saturday uses Linear with Until: 00:20 value 10, Until: 01:15 value 175, and Until: 24:00 value 175.",
  "The zero-tolerance claim is exactly one 288-sample ordered, unique Timestep Schedule Value series and its timestamps. Thursday is [10] then 95 values of 175, Friday is [10, 120] then 94 values of 175, and Saturday is [10, 40, 85, 130] then 92 values of 175.",
  "The EnergyPlus oracle completes with exactly 0 Warning and 0 Severe errors. The aligned default-No boundaries deliberately avoid the non-multiple-Until warning; nonaligned No behavior and warning parity remain outside the claim.",
  "This case consumes only Thursday, Friday, and Saturday from Schedule:Week:Daily and one full-year Schedule:Year range. Other day types, Year ranges, missing, overlap, wrap, and reference diagnostics remain outside the claim.",
  "Schedule:Day:List, Schedule:Week:Compact, other timestep counts, Until 24:MM correction, malformed, duplicate, zero, overlap, or incomplete intervals, Hourly aggregation, and broad input diagnostic parity remain outside the claim.",
  "Daylight-saving, holidays, today/tomorrow rollover, actual-weather, design-day, warmup, multiple environments, downstream schedule consumption, UpdateScheduleVals orchestration, EMS override behavior, and currentVal state remain outside the claim.",
  "Rust raw ESO serialization, Rust EPW record selection, and broad EnergyPlus warning/error parity remain outside the claim.",
]

