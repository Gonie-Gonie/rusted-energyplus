  "The first Through period ends 1/1 and assigns Thursday=105 before AllOtherDays=199. The second ends 12/31 and assigns Tuesday=103, Wednesday=104, and Holiday=108 before AllOtherDays=199. Rust schedule-day ordinals 365, 366, 1, 2, and 3 are source-mapped summary/test diagnostics, not additional fields emitted by EnergyPlus ESO or EIO.",
  "This case proves only fixed Month/Day Through boundaries, the declared For selectors and source-order AllOtherDays complement, one hourly Until endpoint per profile, one cross-year boundary, one RunPeriod, one DATA PERIOD, one record per hour, and clean completion. DST-shifted schedule-clock lookup, hour-24/tomorrow rollover, subhourly interpolation, other schedule families, additional periods or year boundaries, actual weather, design days, warmup, Rust EPW record selection, internal-gain/HVAC/IdealLoads calendar consumption, Rust raw ESO serialization, and broad EnergyPlus warning/error parity remain outside the claim.",
]

