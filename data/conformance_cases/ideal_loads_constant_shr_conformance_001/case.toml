id = "ideal_loads_constant_shr_conformance_001"
title = "One-zone no-OA IdealLoads constant SHR conformance"
milestone = "ideal-loads-humidity-control-conformance"
purpose = "Claim narrow no-outdoor-air IdealLoads ConstantSensibleHeatRatio cooling numerical conformance for declared cooling latent/sensible/total rate and supply-node rows."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "This case claims only the declared no-OA ConstantSensibleHeatRatio cooling outputs.",
  "The boundary excludes ConstantSupplyHumidityRatio, Humidistat, outdoor air, economizer, heat recovery, DCV, finite flow/capacity limits, autosizing, air loops, plant loops, EMS, and PythonPlugin.",
  "Zone System Predicted Sensible Load to Setpoint is the active signed demand input; heating/cooling setpoint loads remain diagnostic proof inputs for ZoneSysEnergyDemand.",
  "Mass-flow and humidity comparison uses the EnergyPlus same-call return-node recirculation state for no-OA humidity-control mixed-air calculations.",
  "Return-node and zone-air-node rows remain diagnostic proof rows; broad node and broad humidity-control conformance remain outside the claim."
]

