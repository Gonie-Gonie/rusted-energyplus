id = "calendar_special_day_epw_idf_precedence_hourly_exact_001"
title = "Input-file special day overrides an EPW holiday"
milestone = "full-source-order-calendar-special-day-epw-idf-precedence"
purpose = "Block on exact ordered hourly day types when an input-file CustomDay1 definition overrides an enabled EPW holiday on the same fixed date."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "This case reuses the leap-observed EPW and IDF from calendar_epw_holiday_fixed_date_enabled_hourly_exact_001, whose one EPW holiday falls on 2/29, and differs only by adding one input-file CustomDay1 definition on the same date.",
  "The RunPeriod explicitly enables weather-file holidays. EnergyPlus resolves the weather-file holiday before the input-file special day, so the later input-file CustomDay1 state wins the exact overlap; the 72 ordered hourly values are 24 Sunday=1, 24 CustomDay1=11, and 24 Tuesday=3.",
  "Weather-file daylight saving, weekend adjustment, rain, snow, and actual-weather handling are explicitly disabled so the case isolates fixed-date EPW-versus-IDF special-day precedence.",
  "The numerical claim covers only the 72 successful ordered, unique hour-ending Site Day Type Index values and timestamps and the weather-file-then-input-file resolved source order for this one exact overlap. EnergyPlus-versus-Rust warning text, count, repetition, and diagnostics parity; reversed or multiple input definitions, other dates, durations, day types, overlap shapes, disabled weather-file holidays, weekend shifting, schedule lookup, tomorrow state, raw ESO serialization, actual weather, and cross-year traversal remain outside this claim.",
]

