id = "window_material_shade_equivalent_layer_001"
title = "Equivalent-layer window shade static definition and occurrence evidence"
milestone = "v0.8-heat-balance"
purpose = "Compare the bounded Rust WindowMaterial:Shade:EquivalentLayer typed slice with EnergyPlus generic definition and equivalent-layer construction occurrence EIO evidence."
comparison_class = "smoke"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "The fixture defines three WindowMaterial:Shade:EquivalentLayer objects: one defaulted shade used once, one high-precision shade reused by exactly two equivalent-layer window constructions, and one valid defaulted shade that is unused.",
  "Three FenestrationSurface:Detailed windows use two of three canonical-name-ordered Construction:WindowEquivalentLayer objects. The defaulted-shade construction is referenced once, the first high-precision construction is referenced twice, and the second high-precision construction is deliberately unused by every surface; every construction contains valid equivalent-layer glazing and sealed-air gap layers.",
  "The generic Material Details table echoes all three shade definitions exactly once, including the unused shade, with canonical name, MediumRough roughness, and zero resistance, thickness, conductivity, density, specific heat, and thermal, solar, and visible absorptance fields.",
  "The specialized WindowMaterial:Shade:EquivalentLayer table emits one construction-layer occurrence for the defaulted shade and two for the reused high-precision shade. The first high-precision construction's two surfaces do not multiply its single occurrence, while the second construction has no surface but still emits its occurrence; the unused shade definition is absent.",
  "The specialized row duplicates the front beam-beam solar transmittance into its front and back columns and exposes directional beam-diffuse solar transmittance and reflectance plus infrared transmittance and directional emissivity, all with EnergyPlus {:.4R} serialization.",
  "Visible beam-beam transmittance, visible beam-diffuse transmittance, and visible beam-diffuse reflectance are deliberately high precision on the reused shade but are absent from the bounded specialized EIO row and remain typed-only evidence.",
  "A fixture-only EnergyManagementSystem:ConstructionIndexVariable references the surface-unused second construction solely to avoid EnergyPlus's nominally-unused-construction warning. The three construction rows and named host/window rows are oracle-only integrity locks; EMS behavior, ratings, optics, layers, and surfaces are not Rust parity claims.",
  "Shade definition order intentionally differs from occurrence and material-name order. Construction declarations remain in canonical name order because ConvertInputFormat erases broad IDF declaration order; no broad or arbitrary declaration-order parity is claimed.",
  "The smoke gate requires a clean EnergyPlus 26.1.0 run, exact generic and specialized headers, exact ordered generic definitions and specialized occurrences, exclusion of the unused definition from occurrences, exact construction/window integrity rows, a converted epJSON artifact, and a passing bounded Rust comparison in explicit exact mode.",
  "This is non-blocking diagnostic-only static material evidence and makes no WindowMaterial:Shade:EquivalentLayer conformance, window runtime, optics, thermal, construction-rating, or fenestration-surface claim.",
]

