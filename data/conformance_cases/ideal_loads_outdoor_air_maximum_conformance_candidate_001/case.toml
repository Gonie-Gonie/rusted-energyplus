id = "ideal_loads_outdoor_air_maximum_conformance_candidate_001"
title = "One-zone IdealLoads outdoor-air Maximum conformance candidate"
milestone = "ideal-loads-outdoor-air-conformance"
purpose = "Claim narrow IdealLoads DesignSpecification:OutdoorAir Maximum conformance for declared outdoor-air mass/volume, no-humidity outdoor-air report rates, supply-air state, and mixed-air state rows."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "This case claims only the declared DesignSpecification:OutdoorAir Maximum rows.",
  "The boundary covers Maximum mass flow, standard-density volume flow, no-humidity outdoor-air sensible/latent/total report rates, supply-air state, and mixed-air state with a blank outdoor-air schedule.",
  "Inactive economizer and inactive heat-recovery report rows remain diagnostic proof evidence.",
  "Active humidity-control latent behavior, active DCV, economizer, heat recovery, humidistats, finite flow/capacity limits, autosizing, air loops, plant loops, EMS, PythonPlugin, and broad outdoor-air conformance remain outside this claim.",
  "The fixture takes the maximum of 0.015 m3/s from Flow/Area, 0.025 m3/s from Flow/Zone, and 180 ACH over the explicit 1 m3 zone volume to produce the same 0.05 m3/s design outdoor-air volume as the Flow/Zone diagnostic.",
  "EnergyPlus reports outdoor-air volume flow at StdRhoAir; the Rust conformance candidate derives StdRhoAir from Site:Location elevation before converting mass flow back to standard-density volume flow."
]

