id = "official_1zone_uncontrolled_dynamic_conformance_candidate_001"
title = "Official 1ZoneUncontrolled dynamic heat-balance conformance candidate"
milestone = "v0.33-official-dynamic-conformance"
purpose = "Gate the official 1ZoneUncontrolled dynamic heat-balance candidate boundary separately from the broad diagnostic probe case."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "Expected status is pass for conformance-level variables in the compatibility-candidate lane.",
  "This candidate gates the promotion variables, including wetbulb/rain-status weather alignment, exact-zero named wall/roof sky and ground diffuse incident solar rows, declared named wall/roof absorbed solar heat gain rate rows, the roof absorbed solar heat gain per-area row, declared inside convection/radiation source rows, declared inside/outside convection coefficient rows, and the floor Surface Heat Storage Rate and Surface Heat Storage Rate per Area under dedicated solar-rate, solar-flux, coefficient, and storage tolerances.",
  "Diagnostic probe algorithms are not eligible for this case; the report must show zone_air_algorithm_lane=compatibility-candidate.",
  "The v0.26 planned official dynamic boundary is promoted here after static, weather, internal convective gain, warmup, and selected dynamic heat-balance evidence pass.",
  "Schedule Value is not declared as a candidate output because the official target fixture does not currently expose a candidate schedule series in the dynamic diagnostic manifest.",
  "Broad solar compatibility beyond the declared named wall/roof incident beam, incident total, exact-zero sky/ground diffuse, named wall/roof absorbed solar heat gain rate, and roof absorbed solar heat gain per-area rows remains outside this conformance claim, as do exterior radiation/convection heat gain rate rows and fenestration compatibility.",
]

