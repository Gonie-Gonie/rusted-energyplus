id = "calendar_special_day_fixed_date_hourly_exact_001"
title = "IDF fixed-date special-day state exact order"
milestone = "full-source-order-calendar-special-day-fixed-date"
purpose = "Block on exact ordered hourly Site Day Type Index state and Holiday timestamps across one input-file fixed-date special day."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "The claim is limited to 72 ordered, unique hour-ending Site Day Type Index samples and their effective day-type timestamps from 2016-02-28 through 2016-03-01.",
  "The input-file 2/29 duration-one Holiday proves exactly 24 Sunday index-1 samples, 24 Holiday index-8 samples, and 24 Tuesday index-3 samples, with Holiday only on the middle day's timestamps.",
  "The EPW observes leap years but declares no holidays or daylight-saving period; the RunPeriod explicitly disables weather-file holidays, daylight saving, and weekend adjustment so this fixture isolates one fixed-date RunPeriodControl:SpecialDays override.",
  "EPW holiday intake and its use flag, weekend shifting, durations beyond one day, Nth/last-weekday rules, overlaps and precedence, schedule lookup, raw ESO serialization, actual weather, and cross-year traversal remain outside this claim.",
]

