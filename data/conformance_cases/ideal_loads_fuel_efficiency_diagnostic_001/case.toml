id = "ideal_loads_fuel_efficiency_diagnostic_001"
title = "One-zone no-OA IdealLoads fuel-efficiency diagnostic"
milestone = "ideal-loads-fuel-meter-diagnostic"
purpose = "Probe ReportPurchasedAir heating and cooling fuel energy rate/energy parity when constant non-unity fuel-efficiency schedules are active."
comparison_class = "diagnostic-only"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "This case is diagnostic-only and does not expand the no-OA/no-limit IdealLoads sensible conformance claim.",
  "The boundary excludes outdoor air, economizer, heat recovery, humidistats, DCV, finite flow/capacity limits, autosizing, air loops, plant loops, EMS, and PythonPlugin.",
  "Heating fuel efficiency is a Schedule:Constant value of 0.8; cooling fuel efficiency is a Schedule:Constant value of 0.75.",
  "Fuel energy rate rows prove the EnergyPlus ReportPurchasedAir raw-rate divided-by-efficiency branch.",
  "Fuel energy rows prove the same efficiency branch with TimeStepSysSec detailed energy accumulation.",
  "DistrictHeatingWater:Facility and DistrictCooling:Facility meters remain oracle-MTR diagnostic requests only; Rust meter time-series value comparison remains outside this case."
]

[manifest_v2]
schema = "rusted-energyplus.case-manifest.v2"
source_kind = "local-fixture"
source_file = "data/conformance_cases/ideal_loads_fuel_efficiency_diagnostic_001/ideal_loads_fuel_efficiency_diagnostic.idf"
tier = "B"

[scope]
domains = ["hvac"]
has_zone = true
has_surface = true
has_fenestration = false
has_air_loop = false
has_plant_loop = false
has_ems = false
has_python_plugin = false
