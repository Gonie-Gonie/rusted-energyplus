id = "ideal_loads_no_oa_sensible_conformance_001"
title = "One-zone no-OA IdealLoads sensible conformance"
milestone = "ideal-loads-conformance-candidate"
purpose = "Claim narrow no-outdoor-air, no-limit IdealLoads sensible numerical conformance for declared thermostat, IdealLoads rate, and supply-node outputs."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "This case claims only the declared no-OA/no-limit IdealLoads sensible conformance outputs.",
  "The boundary excludes outdoor air, economizer, heat recovery, humidistats, DCV, finite flow/capacity limits, autosizing, air loops, plant loops, EMS, and PythonPlugin.",
  "The compare gate applies the declared tolerances to Rust ResultStore series; generated oracle-only baseline reports keep tolerance_policy=none.",
  "IdealLoads rate and node comparisons use Detailed output to avoid false deltas from zone-timestep averaging of nonlinear mass-flow formulas.",
  "Zone System Predicted Sensible Load to Setpoint is the active signed demand input; heating/cooling setpoint loads remain diagnostic proof inputs for ZoneSysEnergyDemand.",
  "Mass-flow comparison uses the source-order pre-update zone air node state; same-timestamp zone air node outputs are diagnostic proof rows.",
  "Energy and fuel energy rows are diagnostic-only proof for the ReportPurchasedAir rate-to-TimeStepSysSec fixed 8-substep fixture branch and blank fuel-efficiency branch; meter outputs and non-unity efficiency schedules remain outside the claim."
]

