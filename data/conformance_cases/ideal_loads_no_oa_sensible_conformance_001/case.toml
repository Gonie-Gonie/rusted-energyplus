id = "ideal_loads_no_oa_sensible_conformance_001"
title = "One-zone no-OA IdealLoads sensible conformance candidate"
milestone = "ideal-loads-conformance-candidate"
purpose = "Stage the narrow no-outdoor-air, no-limit IdealLoads sensible case before claiming numerical conformance."
comparison_class = "diagnostic-only"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "This case is a diagnostic conformance candidate, not an IdealLoads numerical conformance claim.",
  "The boundary excludes outdoor air, economizer, heat recovery, humidistats, DCV, finite flow/capacity limits, autosizing, air loops, plant loops, EMS, and PythonPlugin.",
  "Draft tolerances document the intended promotion gate; generated baseline reports keep tolerance_policy=none until Rust writes matching ResultStore series."
]

[manifest_v2]
schema = "rusted-energyplus.case-manifest.v2"
source_kind = "local-fixture"
source_file = "data/conformance_cases/ideal_loads_no_oa_sensible_conformance_001/ideal_loads_no_oa_sensible_conformance.idf"
tier = "B"

[scope]
domains = ["zone", "hvac", "node"]
has_zone = true
has_surface = true
has_fenestration = false
has_air_loop = false
has_plant_loop = false
has_ems = false
has_python_plugin = false
has_daylighting = false

[input]
idf = "data/conformance_cases/ideal_loads_no_oa_sensible_conformance_001/ideal_loads_no_oa_sensible_conformance.idf"
weather = ".runtime/energyplus/26.1.0/WeatherData/USA_CO_Golden-NREL.724666_TMY3.epw"

[[outputs]]
