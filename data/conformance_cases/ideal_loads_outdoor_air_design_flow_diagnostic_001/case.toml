id = "ideal_loads_outdoor_air_design_flow_diagnostic_001"
title = "One-zone IdealLoads outdoor-air design-flow diagnostic"
milestone = "ideal-loads-outdoor-air-diagnostic"
purpose = "Probe IdealLoads DesignSpecification:OutdoorAir Flow/Zone design-flow parity for outdoor-air mass flow, standard-density volume flow, and sensible outdoor-air report rates."
comparison_class = "diagnostic-only"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "This case is diagnostic-only and does not expand the no-OA/no-limit IdealLoads conformance claim.",
  "The diagnostic boundary covers only DesignSpecification:OutdoorAir Flow/Zone mass flow, standard-density volume flow, and sensible outdoor-air report rates with a blank outdoor-air schedule.",
  "Outdoor-air latent loads, mixed-air state, supply-air state, DCV, economizer, heat recovery, humidistats, finite flow/capacity limits, autosizing, air loops, plant loops, EMS, and PythonPlugin remain outside this diagnostic claim.",
  "EnergyPlus reports outdoor-air volume flow at StdRhoAir; the Rust diagnostic derives StdRhoAir from Site:Location elevation before converting mass flow back to standard-density volume flow."
]

[manifest_v2]
schema = "rusted-energyplus.case-manifest.v2"
source_kind = "local-fixture"
source_file = "data/conformance_cases/ideal_loads_outdoor_air_design_flow_diagnostic_001/ideal_loads_outdoor_air_design_flow_diagnostic.idf"
tier = "B"

[scope]
domains = ["zone", "hvac"]
has_zone = true
has_surface = true
has_fenestration = false
has_air_loop = false
has_plant_loop = false
has_ems = false
has_python_plugin = false
has_daylighting = false

[input]
idf = "data/conformance_cases/ideal_loads_outdoor_air_design_flow_diagnostic_001/ideal_loads_outdoor_air_design_flow_diagnostic.idf"
weather = ".runtime/energyplus/26.1.0/WeatherData/USA_CO_Golden-NREL.724666_TMY3.epw"

[[outputs]]
key = "ZONE ONE IDEAL LOADS"
variable = "Zone Ideal Loads Outdoor Air Mass Flow Rate"
frequency = "detailed"
class = "hvac-state"
source = "eso"
domain = "hvac"
level = "diagnostic"
abs_tol = 1e-9
rmse_tol = 1e-9

[[outputs]]
key = "ZONE ONE IDEAL LOADS"
variable = "Zone Ideal Loads Outdoor Air Standard Density Volume Flow Rate"
frequency = "detailed"
class = "hvac-state"
source = "eso"
domain = "hvac"
level = "diagnostic"
abs_tol = 1e-9
rmse_tol = 1e-9

[[outputs]]
key = "ZONE ONE IDEAL LOADS"
variable = "Zone Ideal Loads Outdoor Air Sensible Heating Rate"
frequency = "detailed"
class = "hvac-state"
source = "eso"
domain = "hvac"
level = "diagnostic"
abs_tol = 1.0
rmse_tol = 1.0

[[outputs]]
key = "ZONE ONE IDEAL LOADS"
variable = "Zone Ideal Loads Outdoor Air Sensible Cooling Rate"
frequency = "detailed"
class = "hvac-state"
source = "eso"
domain = "hvac"
level = "diagnostic"
abs_tol = 1.0
rmse_tol = 1.0

[[tolerances]]
variable_class = "hvac-state"
max_abs = 1.0
max_rmse = 1.0

[report]
format = "markdown"
path = ".runtime/ideal-loads-outdoor-air-design-flow/26.1.0/ideal_loads_outdoor_air_design_flow_diagnostic_001/compare/compare-report.md"

[gate]
script = "scripts/dev.cmd compare-ideal-loads-outdoor-air-design-flow-diagnostic"
blocking = false
