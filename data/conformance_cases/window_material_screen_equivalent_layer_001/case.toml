id = "window_material_screen_equivalent_layer_001"
title = "Equivalent-layer window screen static definition and occurrence evidence"
milestone = "v0.8-heat-balance"
purpose = "Compare the bounded WindowMaterial:Screen:EquivalentLayer typed slice with EnergyPlus generic definition and equivalent-layer construction occurrence EIO evidence."
comparison_class = "smoke"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "The fixture defines three WindowMaterial:Screen:EquivalentLayer objects in explicit source order Z, M, A: one high-precision screen reused by two equivalent-layer constructions, one valid unused screen, and one construction occurrence with default Autocalculate beam-beam solar transmittance plus blank wire spacing and diameter.",
  "Construction:WindowEquivalentLayer declarations use canonical source order A, B, C. A contains the default-Autocalculate blank-geometry definition, while B and C contain the same high-precision Z definition; the exact specialized occurrence sequence is therefore A, Z, Z.",
  "Two FenestrationSurface:Detailed windows share construction B, but B emits one specialized Z occurrence. Construction C has no surface but emits the second Z occurrence. Fixture-only EnergyManagementSystem:ConstructionIndexVariable objects reference surface-unused constructions A and C solely to avoid nominally-unused-construction warnings.",
  "The generic Material Details table echoes all three definitions exactly once in source order Z, M, A, including unused M, with canonical name, MediumRough roughness, and zero resistance, thickness, conductivity, density, specific heat, and thermal, solar, and visible absorptance fields.",
  "The specialized WindowMaterial:Screen:EquivalentLayer header is the malformed EnergyPlus source shape with nine comma-separated tokens, while each data row has twelve. Rows duplicate N2 and N3 for front/back solar state, omit required visible inputs N4 through N6, duplicate N8 for front/back emissivity, and retain N9 and N10.",
  "The A row locks the raw EnergyPlus Autocalculate sentinel as -99999.0000 and source-effective blank geometry as 0.00000/0.00000. The Z rows lock source formatting and reuse multiplicity for high-precision numeric values.",
  "The primary oracle lane requests Constructions and Materials and emits both generic and specialized tables. The Materials-only lane retains generic Z, M, A rows while omitting equivalent-layer construction and specialized rows. The Constructions-only lane retains construction and specialized A, Z, Z rows while omitting generic Material Details.",
  "The gate requires clean EnergyPlus 26.1.0 completion for all three lanes, converted epJSON artifacts, exact headers and rows, exact definition and occurrence order, exact token counts, inclusion of unused M only in generic output, the expected reporting activation boundaries, and passing bounded Rust comparisons in explicit exact mode.",
  "The bounded Rust comparison covers typed definitions and parsed static EIO rows only. This remains non-blocking diagnostic evidence and makes no Rust EIO serializer, equivalent-layer construction packing, CheckAndFixCFSLayer, ASHWAT optics/thermal, rating, surface behavior, runtime, broad diagnostic-text, or conformance claim.",
]

