conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "This case is paired with calendar_special_day_weekend_saturday_disabled_hourly_exact_001 and shares a leap-observed 72-row EPW with no weather-file holidays or daylight-saving period.",
  "The RunPeriod explicitly enables the weekend rule, so the fixed duration-one Saturday 2/27 input-file Holiday is observed two days later on Monday 2/29; the 72 hourly values are 24 Saturday=7, 24 Sunday=1, and 24 Holiday=8.",
  "Weather-file holidays and daylight saving are explicitly disabled so the case isolates the input-file fixed-Saturday plus-two-day branch.",
  "Sunday shifting, blank/default policy, EPW holidays, other special-day types, duration greater than one, Nth/last-weekday rules, overlaps and order, year wrap, schedule lookup, tomorrow state, raw ESO serialization, actual weather, and cross-year traversal remain outside this claim.",
]

