id = "calendar_special_day_nonexistent_fifth_weekday_failure_001"
title = "Nonexistent fifth-Sunday special-day expected failure"
milestone = "full-source-order-calendar-special-day-weekday-rules"
purpose = "Block unless EnergyPlus 26.1 and the Rust runtime both reject the explicit nonexistent `5th Sunday in February` input-file special-day rule before producing hourly samples."
comparison_class = "smoke"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "The expected-failure claim is limited to one duration-one input-file Holiday named `Missing Fifth Sunday Holiday` on the explicit 2016 calendar, whose February contains only four Sundays.",
  "Apply Weekend Holiday Rule is explicitly Yes, but this nonexistent Nth-weekday rule is not rescued or shifted; EnergyPlus and Rust both reject it during date resolution. Other weekend-rule behavior remains outside the claim.",
  "EnergyPlus must terminate with its SetSpecialDayDates not-enough-Nths Severe/Fatal path, while the Rust arbitrary-run CLI must project the corresponding typed TimeAxis error as RuntimeConvergenceFailure and runtime exit status.",
  "The engines have distinct process exit-code contracts; this case compares semantic rejection and zero produced hourly samples, not equality of numeric exit codes or numerical Site Day Type Index values.",
  "Other ordinals, weekdays, months, years, date strings, EPW Nth/Last rules, weekend shifting, duration greater than one, overlap, precedence, declaration order, year wrap, cross-year reprojection, schedule lookup, tomorrow state, and raw successful-run ESO serialization remain outside this claim.",
]

