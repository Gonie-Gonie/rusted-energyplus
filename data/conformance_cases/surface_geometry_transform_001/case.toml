id = "surface_geometry_transform_001"
title = "Relative surface geometry world-coordinate transformation"
milestone = "cp57-geometry-coordinate-transformation"
purpose = "Compare Rust canonical world vertices, area, azimuth, and tilt with EnergyPlus DetailsWithVertices EIO rows under nonzero building rotation, zone rotation, and zone origin."
comparison_class = "smoke"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "The fixture uses Relative detailed-surface coordinates, Building North Axis 30 degrees, Zone Direction of Relative North 45 degrees, and Zone origin (10,20,3).",
  "DetailsWithVertices exposes EnergyPlus canonical UpperLeftCorner, Counterclockwise, World coordinate vertices after GetVertices processing.",
  "The case remains nonclaim and nonblocking while Appendix G, detached shading, daylighting, fenestration, and degenerate diagnostics remain outside the checkpoint.",
]

