id = "calendar_schedule_file_shading_exact_001"
title = "Schedule:File:Shading CSV column mapping at zone timesteps"
milestone = "full-source-order-schedule-file-shading"
purpose = "Block on exact EnergyPlus Schedule:File:Shading comma-file intake, surface-header schedule-name generation, and source-row mapping at Timestep,4."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "The fixture is one non-actual common-year 2013-01-01 Tuesday RunPeriod with Timestep,4, all six RunPeriod weather/calendar policies set to No, and a synthetic 24-row EPW with no daylight saving or holidays.",
  "The comma CSV contains the exact header Date/Time,ALPHA SURFACE,BETA SURFACE plus 35,040 data rows: 365 days times 24 hours times 4 timesteps. The first column carries canonical MM/DD HH:MM labels; the two remaining unique headers create ALPHA SURFACE_shading and BETA SURFACE_shading schedules.",
  "Every source day repeats two distinct 96-sample vectors. ALPHA SURFACE rises from 0.01 through 0.96 while BETA SURFACE falls from 0.96 through 0.01, so the zero-tolerance claim proves header-to-schedule mapping, column separation, and ordered quarter-hour row lookup for exactly the first common-year day.",
  "The external claim is exactly 96 ordered, unique Timestep Schedule Value samples and timestamps for each generated schedule. EnergyPlus must also retain the staged sidecar byte-for-byte, the converted epJSON file_name, the exact clean EIO environment row, and zero-warning completion artifacts.",
  "There are deliberately no zones, surfaces, or ShadowCalculation object. This case proves ScheduleManager CSV intake and generated schedule outputs only; it does not claim Imported ShadowCalculation, surface-name consumption, Surface Outside Face Sunlit Fraction, incident solar, or heat-balance effects.",
  "JSON and unknown-extension inputs, multiple Schedule:File:Shading objects, duplicate, missing, extra, blank, or trailing headers, nonnumeric, short, or extra data, timestamp parsing or validation, other timestep counts, the 366-day row-count branch, February 29 behavior, actual-weather, daylight-saving, cross-year traversal, EMS actuation, a Rust currentVal store, downstream consumers, Rust raw ESO serialization, and broad warning/error parity remain outside the claim.",
]

