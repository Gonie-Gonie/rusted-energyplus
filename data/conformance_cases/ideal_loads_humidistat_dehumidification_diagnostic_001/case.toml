id = "ideal_loads_humidistat_dehumidification_diagnostic_001"
title = "One-zone no-OA IdealLoads humidistat dehumidification diagnostic"
milestone = "ideal-loads-humidity-control-diagnostic"
purpose = "Probe no-outdoor-air IdealLoads Humidistat dehumidification mass-flow, supply humidity, and latent report parity without expanding the promoted sensible conformance claim."
comparison_class = "diagnostic-only"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "This case is diagnostic-only and does not expand the no-OA/no-limit IdealLoads sensible conformance claim.",
  "The boundary activates Humidistat dehumidification while excluding outdoor air, economizer, heat recovery, humidification, DCV, finite flow/capacity limits, autosizing, air loops, plant loops, EMS, and PythonPlugin.",
  "The compare gate applies diagnostic tolerances to Rust ResultStore series; generated oracle-only baseline reports keep tolerance_policy=none.",
  "IdealLoads rate, latent report, and node comparisons use Detailed output to avoid false deltas from zone-timestep averaging of nonlinear mass-flow and enthalpy formulas.",
  "Zone System Predicted Sensible Load to Setpoint is the active signed demand input; heating/cooling setpoint loads remain diagnostic proof inputs for ZoneSysEnergyDemand.",
  "Mass-flow comparison uses the source-order pre-update zone air node state; same-timestamp zone air node outputs are diagnostic proof rows.",
  "Energy and fuel energy rows are diagnostic-only proof for the ReportPurchasedAir rate-to-TimeStepSysSec fixed 8-substep fixture branch and blank fuel-efficiency branch.",
  "DistrictHeatingWater:Facility and DistrictCooling:Facility meters are hourly oracle-MTR vs Rust aggregated fuel-energy diagnostics only; non-unity efficiency schedules remain diagnostic-only, and broad meter conformance remains outside the claim."
]

