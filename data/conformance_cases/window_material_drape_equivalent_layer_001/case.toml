id = "window_material_drape_equivalent_layer_001"
title = "Equivalent-layer window drape static definition and occurrence evidence"
milestone = "v0.8-heat-balance"
purpose = "Compare the bounded Rust WindowMaterial:Drape:EquivalentLayer typed slice with EnergyPlus generic definition and equivalent-layer construction occurrence EIO evidence."
comparison_class = "smoke"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "The fixture defines five WindowMaterial:Drape:EquivalentLayer objects: one defaulted drape used by a surface-unused construction, one high-precision pleated drape reused by exactly two equivalent-layer window constructions, width-only and length-only pleat inputs used by separate surface-unused constructions, and one valid defaulted drape that is unused.",
  "Two FenestrationSurface:Detailed windows share the first high-precision construction. The second high-precision construction has no surface. Fixture-only EnergyManagementSystem:ConstructionIndexVariable objects reference the four surface-unused constructions solely to avoid EnergyPlus nominally-unused-construction warnings.",
  "The generic Material Details table echoes all five drape definitions exactly once, including the unused drape, with canonical name, MediumRough roughness, and zero resistance, thickness, conductivity, density, specific heat, and thermal, solar, and visible absorptance fields.",
  "The specialized WindowMaterial:Drape:EquivalentLayer table emits five construction-layer occurrences in construction order: the defaulted drape once, the high-precision drape once for each of two constructions, the width-only drape once, and the length-only drape once. Surface count does not multiply occurrences, surface-unused constructions still emit occurrences, and the unused definition is absent.",
  "The specialized header contains EnergyPlus's literal empty column after Back Side Beam-Diffuse Solar Transmittance and therefore has fourteen comma-separated tokens while each data row has twelve. The row emits beam-beam solar transmittance only once despite front/back header labels, omits all three visible inputs, serializes optical/infrared fields with {:.4R}, and serializes pleat dimensions with {:.5R}.",
  "EnergyPlus source normalization retains pleat dimensions only when both are nonzero. The width-only and length-only definitions therefore each emit two exact zero pleat dimensions.",
  "The primary oracle run requests Output:Constructions selections Constructions and Materials and therefore emits generic and specialized tables. A second Materials-only oracle run proves that generic Material Details remain present while the specialized drape and equivalent-layer construction headers and rows are absent.",
  "Only the high-precision definition with both pleat dimensions positive is assigned to surfaces. Defaulted and one-zero-pleat drapes remain surface-unused to avoid invalid flat-drape thermal execution while retaining clean static EIO evidence.",
  "Drape definition order intentionally differs from occurrence and material-name order. Construction declarations remain in canonical name order because ConvertInputFormat erases broad IDF declaration order; no broad or arbitrary declaration-order parity is claimed.",
  "The smoke gate requires clean EnergyPlus 26.1.0 primary and Materials-only runs, exact generic and specialized headers and rows, exact occurrence multiplicity/order, exact pleat normalization, exclusion of the unused definition, converted epJSON artifacts, and passing bounded Rust comparisons in explicit exact mode.",
  "This is non-blocking diagnostic-only static material evidence and makes no WindowMaterial:Drape:EquivalentLayer conformance, window runtime, optics, thermal, construction-rating, or fenestration-surface claim.",
]

