id = "calendar_schedule_external_interface_initial_value_exact_001"
title = "ExternalInterface:Schedule inactive initial value at zone timesteps"
milestone = "full-source-order-external-interface-schedule"
purpose = "Block on exact EnergyPlus ExternalInterface:Schedule initial-value population when no ExternalInterface activation object is present."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "The fixture is one non-actual 2032-01-01 Thursday RunPeriod with Timestep,4, all six RunPeriod weather/calendar policies set to No, and a synthetic 24-row EPW with no holidays or daylight saving.",
  "One ExternalInterface:Schedule named EXTERNAL INITIAL VALUE references ScheduleTypeLimits Any Number and declares Initial Value 0.375. No ExternalInterface activation object is present, so EnergyPlus retains that initial value and emits its missing-activation warning exactly once.",
  "The zero-tolerance external claim is exactly 96 ordered, unique Timestep Schedule Value samples and timestamps, each equal to 0.375. The gate also locks all raw EnergyPlus ESO values and timestamp fields.",
  "Converted epJSON must retain exactly one schedule with schedule_type_limits_name Any Number and initial_value 0.375 while containing no ExternalInterface activation family. Exact Environment and disabled-daylight-saving EIO rows plus the one-warning successful ERR and END completion records are also locked.",
  "BCVTB/FMU live exchange, socket or configuration files, mutable updates or currentVal state, warmup and sizing exchange lifecycle, EMS priority, generated internal day/week EIO parity, downstream consumers, multi-object and diagnostic parity, and the following two FunctionalMockupUnitImport/Export schedule families remain outside the claim.",
]

