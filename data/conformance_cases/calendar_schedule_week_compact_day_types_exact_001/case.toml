  "The zero-tolerance claim is exactly one 672-sample ordered, unique Timestep Schedule Value series and its timestamps, raw EnergyPlus ESO values and timestamp fields, the converted epJSON seven-pair source order, the exact 12-slot WeekSchedule Timestep EIO row, and the exact Environment, disabled daylight-saving, and five input-file special-day EIO rows.",
  "The EnergyPlus oracle completes with exactly 0 Warning and 0 Severe errors.",
  "The runtime series dynamically consumes only one representative weekday, Thursday, and one representative weekend day, Saturday. The exact WeekSchedule EIO row additionally locks Monday through Friday to the Weekdays profile and Sunday plus Saturday to the Weekends profile.",
