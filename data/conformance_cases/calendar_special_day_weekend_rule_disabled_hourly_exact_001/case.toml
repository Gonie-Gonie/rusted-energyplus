id = "calendar_special_day_weekend_rule_disabled_hourly_exact_001"
title = "Sunday fixed special day with weekend rule disabled"
milestone = "full-source-order-calendar-special-day-weekend-rule"
purpose = "Block on exact ordered hourly day types when the weekend rule leaves one fixed Sunday input-file Holiday on its source date."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "This case is paired with calendar_special_day_weekend_rule_enabled_hourly_exact_001 and shares the existing leap-observed 72-row EPW with no weather-file holidays or daylight-saving period.",
  "The RunPeriod explicitly disables the weekend rule, so the fixed duration-one Sunday 2/28 input-file Holiday remains on 2/28 and Monday 2/29 keeps its weekday type; the 72 hourly values are 24 Holiday=8, 24 Monday=2, and 24 Tuesday=3.",
  "Weather-file holidays and daylight saving are explicitly disabled so the case isolates the input-file fixed-Sunday policy branch.",
  "Saturday plus-two-day shifting, blank/default policy, EPW holidays, duration greater than one, Nth/last rules, multiple or overlapping days, year wrap, schedule lookup, tomorrow state, raw ESO serialization, actual weather, and cross-year traversal remain outside this claim.",
]

