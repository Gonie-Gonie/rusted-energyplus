id = "calendar_schedule_day_hourly_week_daily_year_leap_exact_001"
title = "Schedule:Day:Hourly, Week:Daily, and Year leap-day pointer exact order"
milestone = "full-source-order-schedule-day-hourly-week-daily-year-leap"
purpose = "Block on exact EnergyPlus source-ordered Schedule:Day:Hourly intake, Schedule:Week:Daily day-type selection, Schedule:Year date-range expansion, and omitted-February-29 pointer copying."
comparison_class = "conformance"
conformance_claim = true
oracle_version = "26.1.0"
notes = [
  "The explicit non-actual 2016-02-28 through 2016-03-01 RunPeriod uses a leap-observed 72-row EPW, Timestep,4, and disables holidays, daylight saving, weekend shifting, rain, and snow.",
  "Three Schedule:Day:Hourly objects provide 24 source-ordered values each: Week A Sunday is 101 through 124, Week A Monday is 201 through 224, and Week B Tuesday is 301 through 324. Both Schedule:Week:Daily objects fill every required ordinary, holiday, design-day, and custom-day field with a valid day-schedule reference.",
  "Schedule:Year assigns Week A to 1/1 through 2/28 and Week B to 3/1 through 12/31, intentionally omitting February 29. EnergyPlus copies the day-59 Week A pointer into leap day, then selects Week A's Monday profile before changing to Week B's Tuesday profile on March 1.",
  "The zero-tolerance external claim is exactly 72 ordered, unique hourly Schedule Value samples and timestamps: February 28 is 101 through 124, February 29 is 201 through 224, and March 1 is 301 through 324.",
  "Schedule:Day:Interval, Schedule:Day:List, Schedule:Week:Compact, malformed or overlapping Schedule:Year ranges, missing references, type-limit and diagnostic parity, daylight-saving, holiday, today/tomorrow day-type combinations, EMS override behavior, currentVal state, downstream schedule consumption, design-day, warmup, actual-weather or multi-environment execution, Rust raw ESO serialization, and broad EnergyPlus warning/error parity remain outside the claim.",
]

