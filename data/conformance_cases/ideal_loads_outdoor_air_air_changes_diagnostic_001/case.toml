id = "ideal_loads_outdoor_air_air_changes_diagnostic_001"
title = "One-zone IdealLoads outdoor-air AirChanges/Hour and mixed-air diagnostic"
milestone = "ideal-loads-outdoor-air-diagnostic"
purpose = "Probe IdealLoads DesignSpecification:OutdoorAir AirChanges/Hour design-flow parity for outdoor-air mass flow, standard-density volume flow, outdoor-air report rates, supply-air state, and mixed-air state."
comparison_class = "diagnostic-only"
conformance_claim = false
oracle_version = "26.1.0"
notes = [
  "This case is diagnostic-only and does not expand the no-OA/no-limit IdealLoads conformance claim.",
  "The diagnostic boundary covers only DesignSpecification:OutdoorAir AirChanges/Hour mass flow, standard-density volume flow, no-humidity outdoor-air sensible/latent/total report rates, supply-air state, mixed-air state, and inactive economizer/heat-recovery reports with a blank outdoor-air schedule.",
  "Active humidity-control latent behavior, active DCV, economizer, heat recovery, humidistats, finite flow/capacity limits, autosizing, air loops, plant loops, EMS, and PythonPlugin remain outside this diagnostic claim.",
  "The fixture uses 180 ACH over the explicit 1 m3 zone volume to produce the same 0.05 m3/s design outdoor-air volume as the Flow/Zone diagnostic.",
  "EnergyPlus reports outdoor-air volume flow at StdRhoAir; the Rust diagnostic derives StdRhoAir from Site:Location elevation before converting mass flow back to standard-density volume flow."
]

