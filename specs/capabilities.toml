]
claim_boundary = "Arbitrary release compatibility is limited to the CP303 exact direct-Zone binding: one fully mixed Zone, zero-hysteresis DualSetpoint, one sequence-one SequentialLoad IdealLoads system, one distinct supply/Zone-air/return topology, no OA or humidity control, and state-backed SourceSetpointThresholds demand. No-OA/no-limit conformance evidence remains limited to declared case variables; every otherwise-valid out-of-binding fixed-demand adapter is diagnostic-only, while blocking models remain unsupported. CP305 additionally requires the exact direct release lane to execute persistent single-unit InitPurchasedAir state, prove one hard-size and BeginEnvrn initialization, and consume its cached finite-flow mass limits; diagnostic fallback still carries no release lifecycle evidence. CP306 additionally builds an immutable TypedModel declaration-order manager plan, rejects active plenum topology before runtime-state mutation, and eagerly snapshots membership outcomes in retained Zone declaration order through each Zone EquipmentConnection and its referenced list entry order, ignoring unreferenced list objects. Until Zone equipment inputs are filled, only the runtime latch and outcome recording are deferred; the first ready call latches before one infallible declaration-order replay. That replay retains membership results, ordered missing-membership diagnostics without fail-fast, immutable plan validation, and selected-unit work afterward. The matched-list ID is Rust diagnostic evidence; this InitPurchasedAir call observes only CheckZoneEquipmentList's Boolean return and does not request optional CtrlZoneNum. Release support remains the exact one-unit direct-Zone binding. Active plenum arrays/barriers, exhaust/multiple-return behavior, Autosize/SizePurchasedAir, multi-unit release dispatch/residual/results, exact message registry, reset/concurrency, broader environment/warmup/adaptive lifecycle, and full Init parity remain outside this claim. CP307 additionally requires an immutable typed selected-unit topology plan and source-ordered one-time transition after the manager sweep. The transition commits its latch before supply validation, preserves invalid-exhaust Severe before return fallback, one-return assignment, the multiple-return warning-without-assignment quirk, zero-return fatal, and the nonfatal-outcome-only OA/economizer advisory as structured lifecycle evidence. Release validation still requires blank IdealLoads exhaust, no Zone exhaust topology, exactly one Zone return, no OA, `SingleZoneReturn`, exact bound identities, one completion, and no topology diagnostic, failure, or advisory. Explicit/invalid exhaust, multiple/zero returns, and economizer branches are direct lifecycle tests only and do not remove `OutdoorAir` or `Economizer` from the forbidden features. The C++ zero-supply bypass is outside this typed required-supply subset, and retained fatal replay is a Rust fail-closed divergence rather than retry parity. Plenum ownership, full sizing/autosizing, multi-unit execution, broader OA behavior, exact messages, wrong-ControlledZone replay, and reset/concurrency remain excluded; capability level and evidence cases are unchanged. CP308 additionally requires the exact release lane to execute the bounded direct-hard-sized `SizePurchasedAir` legacy route after selected-unit topology and before `BeginEnvrn`. The route requires a positive current Zone-equipment slot, no `DesignSpecification:ZoneHVAC:Sizing` binding, no completed Zone sizing run, no `AutoSize` value, and finite nonnegative direct fields. It retains a source-ordered four-field overlay in persistent per-unit state, clears the Init size latch only after normal child return, derives environment flow caches from that overlay, and threads the same capacities into Calc. The source `CurZoneEqNum <= 0` suppression is characterized by direct lifecycle tests but is not release-admitted. This changes lifecycle evidence, not the support envelope or numerical evidence: Autosizing remains forbidden, evidence cases and support level are unchanged, and custom/scalable sizing, design days, Zone sizing arrays and `FinalZoneSizing`, complete sizer calculations, emitted sizing reports and warnings, EMS and shared scratch, child-error and partial-side-effect parity, retry/reset/concurrency, and full `SizePurchasedAir` or `InitPurchasedAir` parity remain excluded. CP309 additionally executes the bounded post-BeginEnvrn supply-temperature diagnostic suffix in cooling-before-heating order, allocates or reuses relative recurring identities, aggregates call count and reported extrema, and exposes the registry through lifecycle JSON. Exact release validation requires every diagnostic identity, event, index, and count to remain zero, so active diagnostics remain direct lifecycle evidence only. Actual message/report sinks, schedule-service effects, exact EnergyPlus process-global registry parity, warmup/sizing counters, broader multi-unit release execution, and reset/concurrency remain excluded; support level, evidence cases, and forbidden features are unchanged. CP310 additionally requires the exact release lane to execute the bounded `CalcPurchAirLoads` entry prefix after each successful Init and before the existing calculation. It records caller-supplied resolved node identities, an exact 12-target zero-result snapshot while actually clearing the three retained fields, heating-then-cooling Remaining demand, availability-manager ordering, unconditional read-site evidence from pre-sampled overall/heating/cooling values, independent mode gates, and the line-2022 `UnitOn` body decision. Release validation requires one prefix call/reset/demand/read-site group plus one normally preallocated ZoneComp `NoAction` visit/Zone write/status copy per coupling, zero `ForceOff`, heating and cooling values/on-counts equal to one/call count, exact bound latest identities, and JSON lifecycle evidence; non-direct runtimes reject this evidence. Line 2023 onward, live schedule/ZoneComp service ownership, OA/EMS/mode selection and all downstream Calc behavior remain outside the claim. Support level, run state, forbidden features, evidence cases, numerical conformance, and full lifecycle status are unchanged. CP311 supersedes CP310's line-2023 exclusion only for the `CalcPurchAirLoads` parent prefix at lines 2023-2040 and the bounded no-OA child route at lines 2781, 2783, 2785, and 2806-2809. The exact release lane consumes the retained CP310 gate in one-for-one order, records a Zone heat-balance reference binding without reading its fields, calls the child and rewrites retained pre-EMS minimum OA flow to zero only for an entered body, reads false EMS and `OutdoorAir` predicates, and records zero sensible and moisture effects; UnitOff skips every body site. Release validation requires reconciled active/UnitOff, child, retained-write, predicate-read, zero-effect, and latest-state evidence plus zero EMS applications, OA effects, and psychrometric calls in direct-only JSON. `OutdoorAir` and `EMS` remain forbidden. Full minimum-OA child services, OA-true/EMS numerics, operating-mode selection at line 2046 and later, support level, run state, evidence cases, and numerical conformance remain unchanged. CP312 supersedes CP311's line-2046 exclusion only for the lines 2046-2047 cooling-entry gate. The exact release lane consumes linked CP310/CP311 snapshots, compares zero minimum-OA sensible effect against finite cooling demand with inclusive `>=`, conditionally records the prevalidated DualHeatCool value after short-circuiting, records no SingleHeat block, and makes a local Cooling assignment exactly when the existing numerical DTO returns Cooling; UnitOff skips the gate. Direct lifecycle JSON reconciles source/UnitOff and cooling/fallthrough partitions, conditional reads, assignments, numerical Cooling counts, and latest state, while non-direct evidence is rejected. This is lifecycle evidence rather than a new numerical or thermostat-family claim. At the CP312 boundary, the cooling body at line 2056, Heat/DeadBand selection at line 2348, live temperature-control service, non-Dual release routes, support level, run state, required or forbidden features, evidence cases, and numerical conformance remain unchanged. CP313 supersedes only that line-2056 exclusion for the lines 2056-2057 cooling OA maximum-flow guard. Exact release preserves nested selector and flow-read short-circuiting across NoLimit, Capacity, FlowRate, and FlowRateAndCapacity; the selected-flow routes compare no-OA `+0.0` with a finite nonnegative initialized maximum, so the excluded warning/reduction body is never entered. Direct lifecycle JSON reconciles CP312 Cooling/UnitOff/non-cooling, selector/read, strict-comparison, and zero-body-entry evidence while non-direct evidence is rejected. This is guard-only lifecycle evidence, not OA, economizer, warning, clamp, numerical, or new finite-limit conformance support. At the CP313 boundary, line 2058 and later behavior, support level, run state, required and forbidden features, evidence cases, and numerical conformance remain unchanged. CP314 supersedes only that line-2058 exclusion for the true body at lines 2058-2078. Direct characterization converts parent outdoor-air mass flow with `StdRhoAir`, retains the zero-initialized first/recurring warning counter and relative index, records first Warning/Continue/timestamp versus later recurring calls with max-only `OAVolFlowRate` and empty maximum units, and clamps local outdoor-air mass flow after either branch. Exact no-OA release never enters the CP313 body, so direct-only lifecycle JSON reconciles zero CP314 density reads, conversions, warnings, indices, and clamps while non-direct evidence is rejected. Line 2082 is the lexical first excluded executable and the dynamic continuation only when CP312 entered cooling and CP313 was false; a CP314-true path instead skips the sibling `else` and next reaches line 2109. This remains structured lifecycle evidence, not actual warning output, OA/economizer behavior, clamp-enabled release numerics, or new finite-limit conformance. Support level, run state, required and forbidden features, evidence cases, and numerical conformance remain unchanged. CP315 supersedes only CP314's line-2082 exclusion for the outer `EconomizerType != NoEconomizer` guard. Public direct release admits exact UnitOff, non-cooling, or active CP313-false fallthrough partitions; the CP313-true/CP314-body skip is pure/internal characterization only. UnitOff and non-cooling skip the guard, while the active fallthrough reads the typed enum once. Exact no-OA release requires `NoEconomizer`, so each active comparison is false and the line-2083 inner condition has zero entries. Internal DifferentialDryBulb/DifferentialEnthalpy characterization stops at that boundary and remains non-release. Direct-only lifecycle JSON reconciles the predecessor partitions, enum reads, comparisons, false results, and zero inner entries; non-direct evidence is rejected. The active true route begins at excluded line 2083, while false and CP314-true routes continue at excluded line 2109. Inner node state, psychrometrics, supply/OA flow effects, `EconoOn`, `TimeEconoActive`, and later Calc numerics remain outside this slice. This does not connect or promote the separate outdoor-air economizer helper: `OutdoorAir` and `Economizer` remain forbidden for the exact direct binding, and support level, run state, required features, evidence cases, and numerical conformance remain unchanged. CP316 supersedes only CP315's line-2083 exclusion for the executable lines 2083-2086 compound cooling economizer condition. Internal characterization preserves the source's repeated typed enum read, left-to-right `&&`/`||` short-circuiting, conditional pre-sampled temperature and stored-enthalpy reads, and strict `<` comparisons. Exact no-OA release always consumes CP315's false `NoEconomizer` result and proves one complete CP316 source-site skip per CP315 transition, with zero selector enum reads, node reads, comparisons, satisfied predicates, or line-2089 body entries. Lines 2087-2088 are non-executable; true continues at the first excluded executable line 2089 and false at line 2109. CP316 does not sample live Node state, recompute enthalpy, call the separate outdoor-air economizer helper, or implement psychrometric and flow effects. This is condition-only lifecycle evidence, not live OA/economizer ownership or numerical support; `OutdoorAir` and `Economizer` remain forbidden, and support level, run state, required features, evidence cases, and numerical conformance remain unchanged. CP317 supersedes only CP316's line-2089 exclusion for the cooling economizer true body at executable lines 2089-2101. Internal characterization preserves all 37 source sites: the Zone humidity-ratio read, canonical `energyplus_psy_cp_air_fn_w` scalar result and explicit `CpAir` assignment; temperature reads, subtraction, `DeltaT` assignment and gate re-read; left-associated divisions with local `CpAir`/`DeltaT` re-reads and initial supply assignment; repeated `CoolingLimit` reads and selector short-circuit; the maximum-flow guard read followed by the clamp-time maximum upper-bound re-read; the inner maximum, outer minimum, and clamped assignment; the resulting supply-flow read followed by outdoor-air flow; and the activation-time supply-flow re-read before ordered `EconoOn`, outdoor-air-flow, system-timestep, and `TimeEconoActive` effects over pre-sampled scalars. This pure psychrometric characterization covers the scalar result only; source static `dwSave`/`cpaSave` state, the initial `dwSave == -100.0` sentinel, cache-hit/miss identity, and concurrent cache lifecycle remain excluded. Exact no-OA release consumes a CP316 predecessor with zero calculation-body entries, so every CP317 transition is a complete all-sites skip with zero reads, calculations, comparisons, clamps, assignments, or timestep effects. Line 2109 is the first excluded executable after the mapped body and intervening closing delimiters/comments. The separate outdoor-air economizer helper remains disconnected. This is lifecycle evidence, not live Node/OA/economizer ownership or numerical support; `OutdoorAir` and `Economizer` remain forbidden, and support level, run state, required features, evidence cases, numerical conformance, and Roadmap state remain unchanged."

claim_boundary_addenda = [
  "CP318 additionally requires the exact direct lane to execute the 19-site common Cooling continuation at `PurchasedAirManager.cc` lines 2109-2116 after CP317 and before the unchanged numerical DTO. UnitOff and non-cooling skip the slice; active Cooling resets the candidate to positive zero and exact release proves retained CP310 `CoolOn=true`, consumes retained `QZnCoolSP` plus identity-checked live Zone humidity ratio and temperature, evaluates canonical `PsyCpAirFnW`, applies strict `DeltaT < -1.0e-5`, and preserves left-associated `(QZnCoolSP / CpAir) / DeltaT`, raw IEEE values, and signed zero. Direct-only lifecycle evidence reconciles all sites. The source psychrometric static cache, line 2119 and later humidity/EMS/limit/mixed-air behavior, live schedule or general Node ownership, and numerical-result reconciliation remain excluded. This changes no support level, run state, required or forbidden features, evidence case, or numerical conformance; `OutdoorAir`, `Economizer`, and `EMS` remain forbidden and broad humidity control remains outside the claim.",
  "CP319 additionally requires the exact direct lane to execute the 21-site Cooling dehumidification-flow candidate at `PurchasedAirManager.cc` lines 2119-2128 after CP318 and before the unchanged numerical DTO. UnitOff and non-cooling skip the slice; active Cooling resets positive zero, reads retained `CoolOn`, and exact direct `DehumidificationControlType::None` proves selector fallthrough without requesting live moisture-demand or Node-humidity services. Private Humidistat characterization alone preserves local assignments and rereads, strict left-to-right `DeltaHumRat < -0.00025 && MdotZnDehumidSP < 0.0`, short-circuiting, raw division, IEEE values, and signed zero. CP319 does not reuse the broader humidity helper or reconcile its candidate with the numerical DTO. Line 2133 and later behavior remain excluded. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; broad humidity control remains outside the claim.",
  "CP320 additionally requires the exact direct lane to execute the 26-site Cooling humidification-flow candidate at `PurchasedAirManager.cc` lines 2133-2144 after CP319 and before the unchanged numerical DTO. UnitOff and non-cooling skip the slice; active Cooling resets positive zero, reads retained same-call `HeatOn`, and exact direct `HumidificationControlType::None` proves the outer selector fallthrough without reading the nested dehumidification selector or requesting live moisture-demand or Node-humidity services. Private Humidistat characterization alone preserves the lazy repeated `DehumidCtrlType == Humidistat || DehumidCtrlType == None` reads, local assignments and rereads, strict left-to-right `DeltaHumRat > 0.00025 && MdotZnHumidSP > 0.0`, short-circuiting, raw division, IEEE values, and signed zero. CP320 does not reuse the broader humidification helper or reconcile its candidate with the numerical DTO. Line 2147 and later behavior remain excluded. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; broad humidity control remains outside the claim.",
  "CP321 additionally requires the exact direct lane to execute the ten-site Cooling capacity-zero flow reset at `PurchasedAirManager.cc` lines 2147-2152 after CP320 and before the unchanged numerical DTO. UnitOff and non-cooling skip the slice; active Cooling preserves lazy repeated `CoolingLimit == Capacity || CoolingLimit == FlowRateAndCapacity` reads, reads retained hard-sized `MaxCoolTotCap` only after a selector match, and compares exact `== 0.0`. A true result assigns positive zero in source order to all three flow candidates; false paths preserve retained same-call CP318 cooling, CP319 dehumidification, and CP320 humidification candidate bits. Exact direct release consumes those three candidate snapshots plus retained model/Init state without live services or numerical-DTO reconciliation. Its pure source transition does not reuse the broader `cooling_capacity_limit_is_zero` helper, perform a finite check, normalize, or clamp; existing public direct admission still rejects unresolved or nonfinite selected sized values before the transition. Line 2155 and later behavior remain excluded. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit and Autosize support remain unchanged.",
  "CP322 additionally requires the exact direct lane to execute the six-site Cooling supply mass-flow maximum at `PurchasedAirManager.cc` executable line 2155 after CP321 and before the unchanged numerical DTO. The lexical sites read retained outdoor-air, cooling, dehumidification, and humidification mass flows, apply the source-shaped five-argument maximum with a positive-zero floor, and assign `SupplyMassFlowRate`; they do not claim a C++ function-argument evaluation order. UnitOff and non-cooling skip the slice. Active Cooling preserves ObjexxFCL's strict-`<` pair tree, left-first tie or unordered selection, and exact signed-zero, NaN, and infinity behavior without Rust floating-point maximum helpers, total ordering, finite checks, normalization, or clamps. Exact direct release consumes post-CP321 candidate results plus retained same-call CP311 pre-EMS outdoor-air state, requiring bitwise positive zero on the no-OA route without duplicate caller scalars, live services, or numerical-DTO reconciliation. Line 2157 and later EMS override, flow-clamp, mixed-air, capacity, and supply-state behavior remain excluded. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit and Autosize support remain unchanged.",
  "CP323 additionally requires the exact direct lane to execute the three-site Cooling supply mass-flow EMS override guard at `PurchasedAirManager.cc` executable line 2157 after CP322 and before the unchanged numerical DTO. The sites read `EMSOverrideMdotOn`, evaluate the Boolean guard, and enter the override body when enabled; UnitOff and non-cooling skip the slice. Private characterization preserves both outcomes, while exact direct release validates the completed same-call CP322 snapshot and private witness and requires the false EMS-disabled route, recording one read and evaluation, zero body entries, and no EMS actuator-service request per active transition. Line 2158 is the first excluded executable; the true body at lines 2158-2159, `EMSValueMassFlowRate`, supply and outdoor-air assignments, `min`, the line-2161 flow-limit condition, and later flow behavior remain excluded. `EMS` remains forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit and Autosize support remain unchanged.",
  "CP324 additionally requires the exact direct lane to execute the complete six-site Cooling supply mass-flow EMS override body at `PurchasedAirManager.cc` executable lines 2158-2159 after CP323 and before the unchanged numerical DTO. The sites read `EMSValueMassFlowRate`, assign supply flow, read outdoor-air and overridden supply flow as lexical minimum operands, apply the source-shaped two-argument minimum, and assign outdoor-air flow. Private true-body characterization preserves strict-`<` comparison and right-operand selection on a tie or unordered result without claiming C++ function-argument evaluation order. UnitOff and non-cooling skip the slice; exact direct release validates the completed same-call CP323 latest snapshot and private witness and requires its false EMS-disabled route, so active direct transitions also complete-skip all six sites with zero body execution, value or flow reads, assignments, minimum evaluations, or EMS service requests. Line 2161 is the first excluded executable; its cooling flow-limit condition and assignment, the line-2166 very-small-flow clamp, and later mixed-air, capacity, and supply-state behavior remain excluded. No EMS field or service is added and `EMS` remains forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit and Autosize support remain unchanged.",
  "CP325 additionally requires the exact direct lane to execute the complete seven-site Cooling supply mass-flow limit guard at `PurchasedAirManager.cc` executable lines 2161-2162 after CP324 and before the unchanged numerical DTO. UnitOff and non-cooling skip every site. Active Cooling preserves lazy repeated `CoolingLimit == FlowRate || CoolingLimit == FlowRateAndCapacity` reads, reads retained `MaxCoolMassFlowRate` only after a selector match, compares strict `> 0.0`, and records whether the deliberately excluded clamp body is entered. Exact direct release validates the completed same-call CP324 latest snapshot and private witness and requires its EMS-disabled complete skip, then obtains the selector from the selected typed system and the maximum from the bit-validated retained Init cache without duplicate caller scalars or live sizing, schedule, Node, psychrometric, EMS, or diagnostic services. A selected positive maximum may record body entry, but CP325 performs no supply-flow read, minimum, assignment, or numerical-DTO reconciliation. Line 2163 is the first excluded executable; the actual supply-flow clamp, line-2166 very-small-flow guard/reset, and later mixed-air, capacity, and supply-state behavior remain excluded. `EMS` and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit support remains unchanged.",
  "CP326 additionally requires the exact direct lane to execute the complete four-site Cooling supply mass-flow limit body at `PurchasedAirManager.cc` executable line 2163 after CP325 and before the unchanged numerical DTO. The sites read retained supply and maximum cooling mass flows as textual minimum operands without claiming C++ function-argument evaluation order, apply ObjexxFCL's source-shaped `a < b ? a : b` two-argument minimum, and assign the result to retained source-local supply flow. UnitOff, non-cooling, and active CP325 guard-false transitions skip every site; only a true body entry executes the body. Private characterization preserves strict-`<` comparison, right-operand selection on tie or unordered values, and exact signed-zero, NaN, and infinity behavior. Exact direct release validates the completed same-call CP325 latest snapshot and private witness, obtains the pre-clamp supply flow from the bit-validated retained CP322 result through unchanged CP323-CP325 lineage, and re-reads the maximum from the retained Init cache without duplicate caller scalars or live sizing, schedule, Node, psychrometric, EMS, or diagnostic services. Coupled and pipeline validation require bit-exact retained CP322-result and Init-cache provenance plus internal CP326 minimum/assignment consistency; they do not reconcile this line-2163 checkpoint with the final numerical DTO because that DTO represents line-2166-and-later downstream work. CP326 does not consume that DTO as input and does not feed or replace it. Line 2166, not line 2167, is the first excluded executable; its very-small-flow guard, line-2167 positive-zero reset, and later mixed-air, capacity, and supply-state behavior remain excluded. `EMS` and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit support remains unchanged.",
  "CP327 additionally requires the exact direct lane to execute the complete four-site Cooling supply mass-flow very-small-flow guard at `PurchasedAirManager.cc` executable line 2166 after CP326 and before the unchanged numerical DTO. The sites read retained supply flow and the `HVAC::VerySmallMassFlow` constexpr as textual relational operands without claiming a C++ built-in relational-operand evaluation order, apply the source `<=`, and record reset-body entry. The operands are side-effect-free, so the observable semantics are only the binary64 `<=` result. UnitOff and non-cooling skip every site; every active Cooling CP326 predecessor evaluates the guard. Equality, both signed zeros, and negative infinity enter the body, while positive infinity and NaN fall through. The threshold is pinned to EnergyPlus 26.1 `DataHVACGlobals.hh:89`, exact `Real64 constexpr VerySmallMassFlow(1.0E-30)` with binary64 bits `0x39b4484bfeebc2a0`. Exact direct release validates the completed same-call CP326 latest snapshot and private witness and obtains the operand from CP326's bit-exact resulting supply flow without a duplicate caller scalar or live sizing, schedule, Node, psychrometric, EMS, or diagnostic service. Coupled and pipeline validation require retained post-CP326 supply provenance plus internal CP327 threshold, comparison, and body-entry consistency; they do not consume, reconcile, feed, or replace the final numerical DTO. Line 2167 is the first excluded executable; its positive-zero assignment and later mixed-air, capacity, and supply-state behavior remain excluded. `EMS` and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit support remains unchanged.",
  "CP328 additionally requires the exact direct lane to execute the single-site Cooling supply mass-flow positive-zero reset body at `PurchasedAirManager.cc` executable line 2167 after CP327 and before the unchanged numerical DTO. The one lexical site assigns source `0.0` to retained `SupplyMassFlowRate`, producing exact binary64 positive zero with IEEE bits `0x0000000000000000`; it does not re-read the line-2166 operands, repeat `<=`, normalize, invoke a minimum or maximum helper, or apply another clamp. UnitOff and non-cooling skip the assignment and retain no local supply-flow result. An active CP327 true route performs the assignment, including for `-0.0`, equality, finite below-threshold values, and negative infinity, while an active guard-false route skips it and preserves predecessor bits exactly, including positive infinity or a NaN payload. Exact direct release validates the completed same-call CP327 latest snapshot and private witness and obtains body entry and pre-assignment flow only from that bit-exact predecessor without a duplicate caller scalar or live sizing, schedule, Node, psychrometric, EMS, or diagnostic service. Coupled and pipeline validation require exact predecessor, assignment, and result-bit consistency; they do not consume, reconcile, feed, or replace the final numerical DTO. Line 2168 is an excluded non-executable closing delimiter, and the `CalcPurchAirMixedAir` call beginning at line 2171 is the first excluded executable; mixed-air, capacity, supply-state, and later behavior remain excluded. `EMS` and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit support remains unchanged.",
  "CP329 additionally requires the exact direct lane to execute the complete Cooling `CalcPurchAirMixedAir` call at `PurchasedAirManager.cc` lines 2171-2178 plus only the bounded direct no-OA child fallback. Nine textual caller sites bind/read the state, selected unit, retained no-OA flow, CP328 supply result, three distinct mixed-air output references, and Cooling mode, then invoke and normally return from the child without claiming C++ argument evaluation order. UnitOff and non-cooling skip this Cooling call; every active Cooling predecessor calls once even for zero supply flow. Exact release validates same-call CP328, `OAMassFlowRate=+0.0`, selected identity, Cooling mode, and coherent finite recirculation state. The child performs no OA-node or psychrometric work, copies recirculation T/W and a coherent enthalpy projection to mixed outputs, zeros both heat-recovery outputs, and leaves heat-recovery active time unchanged. The coherent projection does not claim parity for arbitrary independently stored Node enthalpy, torn/late reads, aliases, active OA/recovery and saturation/cache/diagnostics, failure/replay, or concurrency; the broader outdoor-air mixed-state helper is not the exact child. Direct-only lifecycle evidence preserves CP328-to-CP329-to-numerical order without consuming, reconciling with, feeding, or replacing the numerical DTO. Line 2183 is the first excluded executable after comments at lines 2180-2182; the Heat/DeadBand call at 2454-2461 and later work remain excluded. `OutdoorAir`, `Economizer`, `HeatRecovery`, `EMS`, and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, numerical conformance, capability, or Roadmap state; both Calc routines remain `source_mapped`.",
