d source-ordered one-time transition after the manager sweep. The transition commits its latch before supply validation, preserves invalid-exhaust Severe before return fallback, one-return assignment, the multiple-return warning-without-assignment quirk, zero-return fatal, and the nonfatal-outcome-only OA/economizer advisory as structured lifecycle evidence. Release validation still requires blank IdealLoads exhaust, no Zone exhaust topology, exactly one Zone return, no OA, `SingleZoneReturn`, exact bound identities, one completion, and no topology diagnostic, failure, or advisory. Explicit/invalid exhaust, multiple/zero returns, and economizer branches are direct lifecycle tests only and do not remove `OutdoorAir` or `Economizer` from the forbidden features. The C++ zero-supply bypass is outside this typed required-supply subset, and retained fatal replay is a Rust fail-closed divergence rather than retry parity. Plenum ownership, full sizing/autosizing, multi-unit execution, broader OA behavior, exact messages, wrong-ControlledZone replay, and reset/concurrency remain excluded; capability level and evidence cases are unchanged. CP308 additionally requires the exact release lane to execute the bounded direct-hard-sized `SizePurchasedAir` legacy route after selected-unit topology and before `BeginEnvrn`. The route requires a positive current Zone-equipment slot, no `DesignSpecification:ZoneHVAC:Sizing` binding, no completed Zone sizing run, no `AutoSize` value, and finite nonnegative direct fields. It retains a source-ordered four-field overlay in persistent per-unit state, clears the Init size latch only after normal child return, derives environment flow caches from that overlay, and threads the same capacities into Calc. The source `CurZoneEqNum <= 0` suppression is characterized by direct lifecycle tests but is not release-admitted. This changes lifecycle evidence, not the support envelope or numerical evidence: Autosizing remains forbidden, evidence cases and support level are unchanged, and custom/scalable sizing, design days, Zone sizing arrays and `FinalZoneSizing`, complete sizer calculations, emitted sizing reports and warnings, EMS and shared scratch, child-error and partial-side-effect parity, retry/reset/concurrency, and full `SizePurchasedAir` or `InitPurchasedAir` parity remain excluded."

