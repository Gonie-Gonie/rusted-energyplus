claim_boundary = "Arbitrary release compatibility is limited to explicit finite nonnegative hard sizes inside the CP303 exact direct-Zone binding and its state-backed SourceSetpointThresholds loop. Numeric capacity, flow, and flow+capacity conformance evidence remains limited to declared cases; Autosize or unresolved sizes remain unsupported when they trigger blocking validation, while otherwise-valid out-of-binding fixed-demand adapters are diagnostic-only. CP305 additionally requires the exact direct release lane to execute persistent single-unit InitPurchasedAir state, prove one hard-size and BeginEnvrn initialization, and consume its cached finite-flow mass limits; diagnostic fallback still carries no release lifecycle evidence. CP306 additionally builds an immutable TypedModel declaration-order manager plan, rejects active plenum topology before runtime-state mutation, and eagerly snapshots membership outcomes in retained Zone declaration order through each Zone EquipmentConnection and its referenced list entry order, ignoring unreferenced list objects. Until Zone equipment inputs are filled, only the runtime latch and outcome recording are deferred; the first ready call latches before one infallible declaration-order replay. That replay retains membership results, ordered missing-membership diagnostics without fail-fast, immutable plan validation, and selected-unit work afterward. The matched-list ID is Rust diagnostic evidence; this InitPurchasedAir call observes only CheckZoneEquipmentList's Boolean return and does not request optional CtrlZoneNum. Release support remains the exact one-unit direct-Zone binding. Active plenum arrays/barriers, exhaust/multiple-return behavior, Autosize/SizePurchasedAir, multi-unit release dispatch/residual/results, exact message registry, reset/concurrency, broader environment/warmup/adaptive lifecycle, and full Init parity remain outside this claim. CP307 additionally requires an immutable typed selected-unit topology plan and source-ordered one-time transition after the manager sweep. The transition commits its latch before supply validation, preserves invalid-exhaust Severe before return fallback, one-return assignment, the multiple-return warning-without-assignment quirk, zero-return fatal, and the nonfatal-outcome-only OA/economizer advisory as structured lifecycle evidence. Release validation still requires blank IdealLoads exhaust, no Zone exhaust topology, exactly one Zone return, no OA, `SingleZoneReturn`, exact bound identities, one completion, and no topology diagnostic, failure, or advisory. Explicit/invalid exhaust, multiple/zero returns, and economizer branches are direct lifecycle tests only and do not remove `OutdoorAir` or `Economizer` from the forbidden features. The C++ zero-supply bypass is outside this typed required-supply subset, and retained fatal replay is a Rust fail-closed divergence rather than retry parity. Plenum ownership, full sizing/autosizing, multi-unit execution, broader OA behavior, exact messages, wrong-ControlledZone replay, and reset/concurrency remain excluded; capability level and evidence cases are unchanged. CP308 additionally requires the exact release lane to execute the bounded direct-hard-sized `SizePurchasedAir` legacy route after selected-unit topology and before `BeginEnvrn`. The route requires a positive current Zone-equipment slot, no `DesignSpecification:ZoneHVAC:Sizing` binding, no completed Zone sizing run, no `AutoSize` value, and finite nonnegative direct fields. It retains a source-ordered four-field overlay in persistent per-unit state, clears the Init size latch only after normal child return, derives environment flow caches from that overlay, and threads the same capacities into Calc. The source `CurZoneEqNum <= 0` suppression is characterized by direct lifecycle tests but is not release-admitted. This changes lifecycle evidence, not the support envelope or numerical evidence: Autosizing remains forbidden, evidence cases and support level are unchanged, and custom/scalable sizing, design days, Zone sizing arrays and `FinalZoneSizing`, complete sizer calculations, emitted sizing reports and warnings, EMS and shared scratch, child-error and partial-side-effect parity, retry/reset/concurrency, and full `SizePurchasedAir` or `InitPurchasedAir` parity remain excluded. CP309 additionally executes the bounded post-BeginEnvrn supply-temperature diagnostic suffix in cooling-before-heating order, allocates or reuses relative recurring identities, aggregates call count and reported extrema, and exposes the registry through lifecycle JSON. Exact release validation requires every diagnostic identity, event, index, and count to remain zero, so active diagnostics remain direct lifecycle evidence only. Actual message/report sinks, schedule-service effects, exact EnergyPlus process-global registry parity, warmup/sizing counters, broader multi-unit release execution, and reset/concurrency remain excluded; support level, evidence cases, and forbidden features are unchanged. CP310 additionally requires the exact release lane to execute the bounded `CalcPurchAirLoads` entry prefix after each successful Init and before the existing calculation. It records caller-supplied resolved node identities, an exact 12-target zero-result snapshot while actually clearing the three retained fields, heating-then-cooling Remaining demand, availability-manager ordering, unconditional read-site evidence from pre-sampled overall/heating/cooling values, independent mode gates, and the line-2022 `UnitOn` body decision. Release validation requires one prefix call/reset/demand/read-site group plus one normally preallocated ZoneComp `NoAction` visit/Zone write/status copy per coupling, zero `ForceOff`, heating and cooling values/on-counts equal to one/call count, exact bound latest identities, and JSON lifecycle evidence; non-direct runtimes reject this evidence. Line 2023 onward, live schedule/ZoneComp service ownership, OA/EMS/mode selection and all downstream Calc behavior remain outside the claim. Support level, run state, forbidden features, evidence cases, numerical conformance, and full lifecycle status are unchanged. CP311 supersedes CP310's line-2023 exclusion only for the `CalcPurchAirLoads` parent prefix at lines 2023-2040 and the bounded no-OA child route at lines 2781, 2783, 2785, and 2806-2809. The exact release lane consumes the retained CP310 gate in one-for-one order, records a Zone heat-balance reference binding without reading its fields, calls the child and rewrites retained pre-EMS minimum OA flow to zero only for an entered body, reads false EMS and `OutdoorAir` predicates, and records zero sensible and moisture effects; UnitOff skips every body site. Release validation requires reconciled active/UnitOff, child, retained-write, predicate-read, zero-effect, and latest-state evidence plus zero EMS applications, OA effects, and psychrometric calls in direct-only JSON. `OutdoorAir` and `EMS` remain forbidden. Full minimum-OA child services, OA-true/EMS numerics, operating-mode selection at line 2046 and later, support level, run state, evidence cases, and numerical conformance remain unchanged. CP312 supersedes CP311's line-2046 exclusion only for the lines 2046-2047 cooling-entry gate. The exact release lane consumes linked CP310/CP311 snapshots, compares zero minimum-OA sensible effect against finite cooling demand with inclusive `>=`, conditionally records the prevalidated DualHeatCool value after short-circuiting, records no SingleHeat block, and makes a local Cooling assignment exactly when the existing numerical DTO returns Cooling; UnitOff skips the gate. Direct lifecycle JSON reconciles source/UnitOff and cooling/fallthrough partitions, conditional reads, assignments, numerical Cooling counts, and latest state, while non-direct evidence is rejected. This is lifecycle evidence rather than a new numerical or thermostat-family claim. At the CP312 boundary, the cooling body at line 2056, Heat/DeadBand selection at line 2348, live temperature-control service, non-Dual release routes, support level, run state, required or forbidden features, evidence cases, and numerical conformance remain unchanged. CP313 supersedes only that line-2056 exclusion for the lines 2056-2057 cooling OA maximum-flow guard. Exact release preserves nested selector and flow-read short-circuiting across NoLimit, Capacity, FlowRate, and FlowRateAndCapacity; the selected-flow routes compare no-OA `+0.0` with a finite nonnegative initialized maximum, so the excluded warning/reduction body is never entered. Direct lifecycle JSON reconciles CP312 Cooling/UnitOff/non-cooling, selector/read, strict-comparison, and zero-body-entry evidence while non-direct evidence is rejected. This is guard-only lifecycle evidence, not OA, economizer, warning, clamp, numerical, or new finite-limit conformance support. At the CP313 boundary, line 2058 and later behavior, support level, run state, required and forbidden features, evidence cases, and numerical conformance remain unchanged. CP314 supersedes only that line-2058 exclusion for the true body at lines 2058-2078. Direct characterization converts parent outdoor-air mass flow with `StdRhoAir`, retains the zero-initialized first/recurring warning counter and relative index, records first Warning/Continue/timestamp versus later recurring calls with max-only `OAVolFlowRate` and empty maximum units, and clamps local outdoor-air mass flow after either branch. Exact no-OA release never enters the CP313 body, so direct-only lifecycle JSON reconciles zero CP314 density reads, conversions, warnings, indices, and clamps while non-direct evidence is rejected. Line 2082 is the lexical first excluded executable and the dynamic continuation only when CP312 entered cooling and CP313 was false; a CP314-true path instead skips the sibling `else` and next reaches line 2109. This remains structured lifecycle evidence, not actual warning output, OA