  "CP325 additionally requires the exact direct lane to execute the complete seven-site Cooling supply mass-flow limit guard at `PurchasedAirManager.cc` executable lines 2161-2162 after CP324 and before the unchanged numerical DTO. UnitOff and non-cooling skip every site. Active Cooling preserves lazy repeated `CoolingLimit == FlowRate || CoolingLimit == FlowRateAndCapacity` reads, reads retained `MaxCoolMassFlowRate` only after a selector match, compares strict `> 0.0`, and records whether the deliberately excluded clamp body is entered. Exact direct release validates the completed same-call CP324 latest snapshot and private witness and requires its EMS-disabled complete skip, then obtains the selector from the selected typed system and the maximum from the bit-validated retained Init cache without duplicate caller scalars or live sizing, schedule, Node, psychrometric, EMS, or diagnostic services. A selected positive maximum may record body entry, but CP325 performs no supply-flow read, minimum, assignment, or numerical-DTO reconciliation. Line 2163 is the first excluded executable; the actual supply-flow clamp, line-2166 very-small-flow guard/reset, and later mixed-air, capacity, and supply-state behavior remain excluded. `EMS` and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit support remains unchanged.",
  "CP326 additionally requires the exact direct lane to execute the complete four-site Cooling supply mass-flow limit body at `PurchasedAirManager.cc` executable line 2163 after CP325 and before the unchanged numerical DTO. The sites read retained supply and maximum cooling mass flows as textual minimum operands without claiming C++ function-argument evaluation order, apply ObjexxFCL's source-shaped `a < b ? a : b` two-argument minimum, and assign the result to retained source-local supply flow. UnitOff, non-cooling, and active CP325 guard-false transitions skip every site; only a true body entry executes the body. Private characterization preserves strict-`<` comparison, right-operand selection on tie or unordered values, and exact signed-zero, NaN, and infinity behavior. Exact direct release validates the completed same-call CP325 latest snapshot and private witness, obtains the pre-clamp supply flow from the bit-validated retained CP322 result through unchanged CP323-CP325 lineage, and re-reads the maximum from the retained Init cache without duplicate caller scalars or live sizing, schedule, Node, psychrometric, EMS, or diagnostic services. Coupled and pipeline validation require bit-exact retained CP322-result and Init-cache provenance plus internal CP326 minimum/assignment consistency; they do not reconcile this line-2163 checkpoint with the final numerical DTO because that DTO represents line-2166-and-later downstream work. CP326 does not consume that DTO as input and does not feed or replace it. Line 2166, not line 2167, is the first excluded executable; its very-small-flow guard, line-2167 positive-zero reset, and later mixed-air, capacity, and supply-state behavior remain excluded. `EMS` and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit support remains unchanged.",
  "CP327 additionally requires the exact direct lane to execute the complete four-site Cooling supply mass-flow very-small-flow guard at `PurchasedAirManager.cc` executable line 2166 after CP326 and before the unchanged numerical DTO. The sites read retained supply flow and the `HVAC::VerySmallMassFlow` constexpr as textual relational operands without claiming a C++ built-in relational-operand evaluation order, apply the source `<=`, and record reset-body entry. The operands are side-effect-free, so the observable semantics are only the binary64 `<=` result. UnitOff and non-cooling skip every site; every active Cooling CP326 predecessor evaluates the guard. Equality, both signed zeros, and negative infinity enter the body, while positive infinity and NaN fall through. The threshold is pinned to EnergyPlus 26.1 `DataHVACGlobals.hh:89`, exact `Real64 constexpr VerySmallMassFlow(1.0E-30)` with binary64 bits `0x39b4484bfeebc2a0`. Exact direct release validates the completed same-call CP326 latest snapshot and private witness and obtains the operand from CP326's bit-exact resulting supply flow without a duplicate caller scalar or live sizing, schedule, Node, psychrometric, EMS, or diagnostic service. Coupled and pipeline validation require retained post-CP326 supply provenance plus internal CP327 threshold, comparison, and body-entry consistency; they do not consume, reconcile, feed, or replace the final numerical DTO. Line 2167 is the first excluded executable; its positive-zero assignment and later mixed-air, capacity, and supply-state behavior remain excluded. `EMS` and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit support remains unchanged.",
  "CP328 additionally requires the exact direct lane to execute the single-site Cooling supply mass-flow positive-zero reset body at `PurchasedAirManager.cc` executable line 2167 after CP327 and before the unchanged numerical DTO. The one lexical site assigns source `0.0` to retained `SupplyMassFlowRate`, producing exact binary64 positive zero with IEEE bits `0x0000000000000000`; it does not re-read the line-2166 operands, repeat `<=`, normalize, invoke a minimum or maximum helper, or apply another clamp. UnitOff and non-cooling skip the assignment and retain no local supply-flow result. An active CP327 true route performs the assignment, including for `-0.0`, equality, finite below-threshold values, and negative infinity, while an active guard-false route skips it and preserves predecessor bits exactly, including positive infinity or a NaN payload. Exact direct release validates the completed same-call CP327 latest snapshot and private witness and obtains body entry and pre-assignment flow only from that bit-exact predecessor without a duplicate caller scalar or live sizing, schedule, Node, psychrometric, EMS, or diagnostic service. Coupled and pipeline validation require exact predecessor, assignment, and result-bit consistency; they do not consume, reconcile, feed, or replace the final numerical DTO. Line 2168 is an excluded non-executable closing delimiter, and the `CalcPurchAirMixedAir` call beginning at line 2171 is the first excluded executable; mixed-air, capacity, supply-state, and later behavior remain excluded. `EMS` and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, or numerical conformance; finite-limit support remains unchanged.",
  "CP329 additionally requires the exact direct lane to execute the complete Cooling `CalcPurchAirMixedAir` call at `PurchasedAirManager.cc` lines 2171-2178 plus only the bounded direct no-OA child fallback. Nine textual caller sites bind/read the state, selected unit, retained no-OA flow, CP328 supply result, three distinct mixed-air output references, and Cooling mode, then invoke and normally return from the child without claiming C++ argument evaluation order. UnitOff and non-cooling skip this Cooling call; every active Cooling predecessor calls once even for zero supply flow. Exact release validates same-call CP328, `OAMassFlowRate=+0.0`, selected identity, Cooling mode, and coherent finite recirculation state. The child performs no OA-node or psychrometric work, copies recirculation T/W and a coherent enthalpy projection to mixed outputs, zeros both heat-recovery outputs, and leaves heat-recovery active time unchanged. The coherent projection does not claim parity for arbitrary independently stored Node enthalpy, torn/late reads, aliases, active OA/recovery and saturation/cache/diagnostics, failure/replay, or concurrency; the broader outdoor-air mixed-state helper is not the exact child. Direct-only lifecycle evidence preserves CP328-to-CP329-to-numerical order without consuming, reconciling with, feeding, or replacing the numerical DTO. Line 2183 is the first excluded executable after comments at lines 2180-2182; the Heat/DeadBand call at 2454-2461 and later work remain excluded. `OutdoorAir`, `Economizer`, `HeatRecovery`, `EMS`, and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, numerical conformance, capability, or Roadmap state; both Calc routines remain `source_mapped`.",
  "CP330 additionally requires the exact direct lane to execute the complete three-site Cooling positive-supply guard at `PurchasedAirManager.cc` executable line 2183 after CP329 and before the unchanged numerical DTO. UnitOff and non-cooling skip it. Every active Cooling predecessor reads retained CP329 `SupplyMassFlowRate` and evaluates strict `> +0.0` once, then executes the conditional body-entry site only when true, yielding `2 * active + positive_body_entries` dynamic site executions; the literal is not another site and no C++ relational-operand order is claimed. Raw IEEE semantics make signed zeros, negative finite values, negative infinity, and NaN false and positive finite values and positive infinity true without finite checks, normalization, total ordering, or clamps. Exact release consumes only the same-call CP329 direct no-OA snapshot and witness; CP327/CP328 direct lineage has already canonicalized ordered values at or below `HVAC::VerySmallMassFlow` to positive zero while an unordered NaN can remain bit-exact. Direct-only lifecycle evidence preserves CP329-to-CP330-to-numerical order without consuming, reconciling with, feeding, or replacing the numerical DTO. Line 2184 is commentary; line 2185 is the first excluded lexical executable and true-body executable. Lines 2185-2337, the 2339-2345 false body whose dynamic next executable is 2340, the Heat/DeadBand sibling at 2347-2348, its mixed-air call at 2454-2461, and sibling guard at 2465 remain excluded. `OutdoorAir`, `Economizer`, `HeatRecovery`, `EMS`, and Autosizing remain forbidden. This changes no support level, run state, required or forbidden feature, evidence case, numerical conformance, capability, or Roadmap state; both Calc routines remain `source_mapped`.",
  "CP329/CP330 fail-closed retained-chain hardening additionally requires lifecycle admission to prove the full retained predecessor chain. CP329's runtime-aware completed proof recursively validates completed CP328 through its latest/private witness and upstream prefix, while completed and pending CP329 UnitOff/non-cooling/active histories must match CP328 exactly; a route-aware checked-arithmetic preflight covers every next counter and caller/child source-site increment before mutation. CP330 completed and pending history must match CP329 exactly and recursively retain that CP328-chain proof, so coordinated CP329/CP330 counter or witness corruption cannot bypass CP328. Chain, history, witness, and overflow failures leave runtime state and private witnesses unchanged. This adds no numerical DTO consumption or reconciliation and changes no support level, run state, feature boundary, evidence case, numerical conformance, capability, count, readiness, routine, or Roadmap state.",
  "CP331 additionally requires the exact direct lane to execute the single three-site Cooling positive-supply `CpAir` assignment at `PurchasedAirManager.cc` executable line 2185 after CP330 and before the unchanged numerical DTO. The sites read controlled Zone heat-balance `airHumRat`, evaluate canonical `PsyCpAirFnW`, and assign local `CpAir`. UnitOff, non-cooling, and CP330 active guard-false routes skip every site; a CP330 positive-body entry executes all three, so dynamic source-site executions equal `3 * positive_supply_mass_flow_body_entries`. Exact release conditionally reads the identity-checked live Zone humidity and requires its bits to match CP329's retained no-OA recirculation- and mixed-air humidity copies, which are same-call lineage evidence rather than substitute source operands. Positive-route admission requires the live humidity to be finite and `>= 0.0` (both signed zeros are admitted) and the canonical `CpAir` result to be finite. It recursively validates CP330 latest/private-witness and route history through the retained predecessor chain and preflights every conditional source and private-witness increment transactionally. Rust claims only the existing stateless canonical scalar on the admitted physical-domain route. The C++ program-wide `dwSave`/`cpaSave` cache, `-100.0` sentinel and raw-`-100.0` first-call anomaly, hit/miss/reset/interleaving/concurrency behavior, all-`f64` cache equivalence, and full `PsyCpAirFnW` parity remain excluded. Direct-only lifecycle evidence preserves CP330-to-CP331-to-numerical order without consuming, reconciling with, feeding, or replacing the numerical DTO. Line 2186 is the first excluded lexical executable on the true route; lines 2186-2337, the 2339-2345 false body whose dynamic next executable is 2340, the Heat/DeadBand sibling at 2347-2348, its mixed-air call at 2454-2461, and sibling guard at 2465 remain excluded. `OutdoorAir`, `Economizer`, `HeatRecovery`, `EMS`, Autosizing, broad humidity control, and supply-temperature/capacity behavior remain unpromoted. This changes no support level, run state, required or forbidden feature, evidence case, numerical conformance, capability, count, readiness, routine, or Roadmap state; both parent algorithms remain `scaffold`/`none` and both Calc routines remain `source_mapped`.",
]

