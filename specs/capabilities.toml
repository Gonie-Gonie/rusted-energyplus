[[capability]]
id = "ideal_loads_no_oa_sensible"
domain = "ideal_loads"
support_level = "compatibility"
run_state = "supported_compatibility_run"
required_objects = [
  "ZoneHVAC:IdealLoadsAirSystem",
  "ZoneHVAC:EquipmentConnections",
  "ZoneHVAC:EquipmentList",
  "ZoneControl:Thermostat",
  "ThermostatSetpoint:DualSetpoint",
]
forbidden_active_features = [
  "OutdoorAir",
  "Economizer",
  "HeatRecovery",
  "Autosizing",
  "EMS",
  "PythonPlugin",
]
algorithms = [
  "ideal_loads_zone_equipment_purchased_air_source_order",
  "ideal_loads_air_system",
]
evidence_cases = [
  "ideal_loads_blank_fuel_efficiency_conformance_candidate_001",
  "ideal_loads_constant_fuel_efficiency_conformance_candidate_001",
  "ideal_loads_no_oa_facility_meter_conformance_candidate_001",
  "ideal_loads_no_oa_facility_meter_monthly_run_period_conformance_candidate_001",
  "ideal_loads_no_oa_report_energy_conformance_candidate_001",
  "ideal_loads_no_oa_sensible_conformance_001",
  "ideal_loads_non_constant_fuel_efficiency_conformance_candidate_001",
]
claim_boundary = "Arbitrary release compatibility is limited to the CP303 exact direct-Zone binding: one fully mixed Zone, zero-hysteresis DualSetpoint, one sequence-one SequentialLoad IdealLoads system, one distinct supply/Zone-air/return topology, no OA or humidity control, and state-backed SourceSetpointThresholds demand. No-OA/no-limit conformance evidence remains limited to declared case variables; every otherwise-valid out-of-binding fixed-demand adapter is diagnostic-only, while blocking models remain unsupported. CP305 additionally requires the exact direct release lane to execute persistent single-unit InitPurchasedAir state, prove one hard-size and BeginEnvrn initialization, and consume its cached finite-flow mass limits; diagnostic fallback still carries no release lifecycle evidence. CP306 additionally builds an immutable TypedModel declaration-order manager plan, rejects active plenum topology before runtime-state mutation, and eagerly snapshots membership outcomes in retained Zone declaration order through each Zone EquipmentConnection and its referenced list entry order, ignoring unreferenced list objects. Until Zone equipment inputs are filled, only the runtime latch and outcome recording are deferred; the first ready call latches before one infallible declaration-order replay. That replay retains membership results, ordered missing-membership diagnostics without fail-fast, immutable plan validation, and selected-unit work afterward. The matched-list ID is Rust diagnostic evidence; this InitPurchasedAir call observes only CheckZoneEquipmentList's Boolean return and does not request optional CtrlZoneNum. Release support remains the exact one-unit direct-Zone binding. Active plenum arrays/barriers, exhaust/multiple-return behavior, Autosize/SizePurchasedAir, multi-unit release dispatch/residual/results, exact message registry, reset/concurrency, broader environment/warmup/adaptive lifecycle, and full Init parity remain outside this claim. CP307 additionally requires an immutable typed selected-unit topology plan and source-ordered one-time transition after the manager sweep. The transition commits its latch before supply validation, preserves invalid-exhaust Severe before return fallback, one-return assignment, the multiple-return warning-without-assignment quirk, zero-return fatal, and the nonfatal-outcome-only OA/economizer advisory as structured lifecycle evidence. Release validation still requires blank IdealLoads exhaust, no Zone exhaust topology, exactly one Zone return, no OA, `SingleZoneReturn`, exact bound identities, one completion, and no topology diagnostic, failure, or advisory. Explicit/invalid exhaust, multiple/zero returns, and economizer branches are direct lifecycle tests only and do not remove `OutdoorAir` or `Economizer` from the forbidden features. The C++ zero-supply bypass is outside this typed required-supply subset, and retained fatal replay is a Rust fail-closed divergence rather than retry parity. Plenum ownership, full sizing/autosizing, multi-unit execution, broader OA behavior, exact messages, wrong-ControlledZone replay, and reset/concurrency remain excluded; capability level and evidence cases are unchanged. CP308 additionally requires the exact release lane to execute the bounded direct-hard-sized `SizePurchasedAir` legacy route after selected-unit topology and before `BeginEnvrn`. The route requires a positive current Zone-equipment slot, no `DesignSpecification:ZoneHVAC:Sizing` binding, no completed Zone sizing run, no `AutoSize` value, and finite nonnegative direct fields. It retains a source-ordered four-field overlay in persistent per-unit state, clears the Init size latch only after normal child return, derives environment flow caches from that overlay, and threads the same capacities into Calc. The source `CurZoneEqNum <= 0` suppression is characterized by direct lifecycle tests but is not release-admitted. This changes lifecycle evidence, not the support envelope or numerical evidence: Autosizing remains forbidden, evidence cases and support level are unchanged, and custom/scalable sizing, design days, Zone sizing arrays and `FinalZoneSizing`, complete sizer calculations, emitted sizing reports and warnings, EMS and shared scratch, child-error and partial-side-effect parity, retry/reset/concurrency, and full `SizePurchasedAir` or `InitPurchasedAir` parity remain excluded."

