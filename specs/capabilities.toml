schema = "rusted-energyplus.capabilities.v1"
oracle_version = "26.1.0"

[arbitrary_run]
status = "initial"
claim_boundary = "ad-hoc arbitrary runs never set conformance_claim=true automatically"
default_mode = "compatibility"
support_gate = "internal"
run_result_states = "specs/run_result_states.toml"

[[capability]]
id = "official_1zone_uncontrolled_declared_heat_balance"
domain = "heat_balance"
support_level = "compatibility"
run_state = "supported_compatibility_run"
required_objects = [
  "Zone",
  "BuildingSurface:Detailed",
  "Construction",
  "Material",
  "Material:NoMass",
  "RunPeriod",
  "Timestep",
]
forbidden_active_features = [
  "AirLoopHVAC",
  "PlantLoop",
  "EMS",
  "PythonPlugin",
  "AirflowNetwork",
  "Daylighting",
  "FenestrationSurface",
  "Autosizing",
]
algorithms = [
  "heat_balance_manager_source_order",
  "heat_balance_surface_manager_source_order",
  "heat_balance_air_manager_source_order",
  "zone_temp_predictor_corrector_source_order",
  "official_dynamic_heat_balance_compat_candidate",
]
evidence_cases = [
  "official_1zone_uncontrolled_dynamic_conformance_candidate_001",
]
claim_boundary = "Official 1ZoneUncontrolled compatibility only for declared variables and tolerances."

[[capability]]
id = "ideal_loads_no_oa_sensible"
