[[unsupported_rule]]
id = "unsupported_hvac_air_loop"
object_patterns = ["AirLoopHVAC*", "Fan:*", "Coil:*", "Controller:*", "SetpointManager:*", "AirTerminal:*", "OutdoorAir:*"]
severity = "run_blocked"
reason = "Broad HVAC air-loop semantics are not ported."

[[unsupported_rule]]
id = "unsupported_hvac_zone_equipment"
object_patterns = ["ZoneHVAC:*"]
except_object_patterns = ["ZoneHVAC:IdealLoadsAirSystem", "ZoneHVAC:EquipmentConnections", "ZoneHVAC:EquipmentList"]
severity = "run_blocked"
reason = "Broad ZoneHVAC equipment semantics outside declared IdealLoads branches are not ported."

[[unsupported_rule]]
id = "unsupported_plant"
object_patterns = ["PlantLoop", "Branch", "BranchList", "Connector:*", "ConnectorList", "Pump:*", "Boiler:*", "Chiller:*"]
severity = "run_blocked"
reason = "Plant loop semantics are not ported."

[[unsupported_rule]]
id = "unsupported_ems_python_airflow"
object_patterns = ["EnergyManagementSystem:*", "PythonPlugin:*", "AirflowNetwork:*"]
severity = "run_blocked"
reason = "Runtime-modifying plugin/network features are not ported."

[[unsupported_rule]]
id = "unsupported_sizing"
object_patterns = ["Sizing:*", "ZoneSizing*"]
severity = "run_blocked"
reason = "Sizing workflows are not ported."

[[unsupported_rule]]
id = "unsupported_zone_grouping"
object_patterns = ["ZoneList", "ZoneGroup"]
severity = "run_blocked"
reason = "ZoneList target expansion and ZoneGroup list-multiplier runtime semantics are not ported."

[[unsupported_rule]]
id = "unsupported_zone_local_environment"
object_patterns = ["ZoneProperty:LocalEnvironment"]
severity = "run_blocked"
reason = "Zone-local outdoor-air node conditions and downstream weather consumers are not ported."

[[unsupported_rule]]
id = "unsupported_space_partitioning"
object_patterns = ["Space", "SpaceList"]
severity = "run_blocked"
reason = "Authored and generated-remainder Space partitioning, SpaceList expansion, and space-level heat-balance consumers are not ported; sole generated whole-zone defaults remain inactive."

[[unsupported_rule]]
id = "unsupported_surface_boundary"
object_patterns = ["FenestrationSurface:*", "Window*", "Daylighting:*", "Shading:*", "Site:Ground*", "Material:RoofVegetation", "MaterialProperty:VariableAbsorptance", "MaterialProperty:PhaseChangeHysteresis", "MaterialProperty:PhaseChange", "MaterialProperty:VariableThermalConductivity", "MaterialProperty:MoisturePenetrationDepth:Settings", "MaterialProperty:HeatAndMoistureTransfer:Settings", "MaterialProperty:HeatAndMoistureTransfer:SorptionIsotherm", "MaterialProperty:HeatAndMoistureTransfer:Suction", "MaterialProperty:HeatAndMoistureTransfer:Redistribution", "MaterialProperty:HeatAndMoistureTransfer:Diffusion", "MaterialProperty:HeatAndMoistureTransfer:ThermalConductivity", "SurfaceProperties:VaporCoefficients", "SurfaceProperty:IncidentSolarMultiplier", "SurfaceProperty:SolarIncidentInside", "ComplexFenestrationProperty:SolarAbsorbedLayers", "Construction:FfactorGroundFloor", "Construction:CfactorUndergroundWall", "Construction:AirBoundary", "Construction:ComplexFenestrationState", "ConstructionProperty:InternalHeatSource", "Construction:WindowEquivalentLayer", "Construction:WindowDataFile"]
severity = "run_blocked"
reason = "Fenestration, daylighting, shading, and advanced material or surface runtime semantics are not ported."

[[partial_rule]]
id = "ignored_reporting_objects"
object_patterns = ["Output:*", "OutputControl:*"]
eligible_state = "partial_supported_run"
reason = "Reporting requests can be exported or reported unsupported without changing simulation semantics."

[[partial_rule]]
id = "inactive_or_unused_raw_objects"
object_patterns = ["SimulationControl", "SizingPeriod:DesignDay", "HeatBalanceAlgorithm", "ShadowCalculation", "Exterior:Lights"]
eligible_state = "partial_supported_run"
reason = "Preserved for diagnostics or staging when inactive for the current runtime subset."

[[consumed_object]]
id = "global_geometry_rules"
object_type = "GlobalGeometryRules"
algorithms = [
  "geometry_coordinate_transformation",
]
reason = "Typed compiler geometry canonicalization consumes these rules before arbitrary runtime execution."

[arbitrary_run.runtime.heat_balance_zone_air_diagnostic]
status = "supported-compatibility"
scope = "one-zone opaque-surface heat-balance diagnostic runtime with fixed Rust compatibility defaults"
objects = [
  "Version",
  "Building",
  "Timestep",
  "SurfaceConvectionAlgorithm:Inside",
  "SurfaceConvectionAlgorithm:Outside",
  "RunPeriod",
  "Site:Location",
  "Material",
  "Material:NoMass",
  "Construction",
  "ScheduleTypeLimits",
  "Schedule:Constant",
  "Schedule:Compact",
  "OtherEquipment",
  "People",
  "Zone",
  "BuildingSurface:Detailed",
]

[arbitrary_run.runtime.ideal_loads_purchased_air_compat]
status = "supported-compatibility"
scope = "ZoneEquipmentManager -> PurchasedAirManager source-order compatibility for declared no-OA sensible, finite-limit, ConstantSensibleHeatRatio, and selected no-OA humidity-control branches; no broad HVAC conformance claim"
objects = [
  "ThermostatSetpoint:DualSetpoint",
  "ZoneControl:Thermostat",
  "NodeList",
  "ZoneHVAC:IdealLoadsAirSystem",
  "ZoneHVAC:EquipmentList",
  "ZoneHVAC:EquipmentConnections",
]

[arbitrary_run.runtime.ideal_loads_node_state_projection]
status = "legacy-diagnostic-only"
scope = "Air-side node-state projection retained for diagnostics; not selected for declared compatibility IdealLoads branches"
objects = [
  "NodeList",
  "ZoneHVAC:IdealLoadsAirSystem",
  "ZoneHVAC:EquipmentList",
  "ZoneHVAC:EquipmentConnections",
]

[arbitrary_run.ignored_raw_only_objects]
reason = "preserved for diagnostics or handled by output/oracle staging rather than evaluated by the Rust runtime"
objects = [
  "SimulationControl",
  "SizingPeriod:DesignDay",
  "HeatBalanceAlgorithm",
  "ShadowCalculation",
  "Exterior:Lights",
  "Output:*",
  "OutputControl:*",
]

[arbitrary_run.unsupported_families]
ems = "EnergyManagementSystem:*"
python_plugin = "PythonPlugin:*"
airflow_network = "AirflowNetwork:*"
hvac = "AirLoopHVAC*, Fan:*, Coil:*, Controller:*, SetpointManager:*, AirTerminal:*, broad ZoneHVAC:*"
plant = "PlantLoop, Branch, BranchList, Connector:*, ConnectorList, Pump:*, Boiler:*, Chiller:*"
sizing = "Sizing:* and ZoneSizing*"
zone_grouping = "ZoneList, ZoneGroup"
surface_boundary = "FenestrationSurface:*, Window*, Daylighting:*, Shading:*, Site:Ground*"

