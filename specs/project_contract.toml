[optimization]
allowed = [
  "typed_ids",
  "data_structures",
  "execution_plan",
  "precompute",
  "cache",
  "output_handles",
  "trace_throttling",
  "diagnostics",
  "result_store",
  "numerical_implementation_within_tolerance",
  "code_organization",
]
forbidden_without_experimental_mode = [
  "engineering_algorithm_change",
  "algorithm_variant_delta_tuning",
  "diagnostic_probe_as_compatibility_candidate",
  "timestep_semantics_change",
  "setpoint_manager_timing_change",
  "plant_dispatch_semantics_change",
]

[[mode]]
id = "compatibility"
claim_eligible = true
description = "EnergyPlus source-order algorithm path."

[[mode]]
id = "diagnostic"
claim_eligible = false
description = "Compatibility functions plus extra instrumentation or probes."

[[mode]]
id = "partial"
claim_eligible = false
description = "Explicit supported-subset run; diagnostic/ad-hoc only."

[[mode]]
id = "fast"
claim_eligible = false
description = "Performance-oriented experiment; not compatibility evidence."

[[mode]]
id = "experimental"
claim_eligible = false
description = "Algorithm or semantic experiment; not compatibility evidence."

[run_states]
spec = "specs/run_result_states.toml"

[diagnostic_only]
can_call_compatibility_path = true
can_be_counted_as_conformance = false
rules = [
  "diagnostic_rows_do_not_increment_conformance_counts",
  "diagnostic_reports_do_not_create_claims",
  "conformance_case_selecting_diagnostic_algorithm_must_fail",
]

[partial_runs]
opt_in_required = true
conformance_claim = false
rules = [
  "ignored_objects_are_listed",
  "inactive_or_ignorable_objects_require_explicit_rule",
  "active_ignored_objects_require_approximation_mode",
  "partial_results_are_labeled_diagnostic",
]

[documentation]
markdown_role = "human_explanation"
spec_role = "machine_readable_decision_source"
generated_docs_role = "navigation"
reports_role = "evidence"

[[current_status_classification]]
id = "conformance"
source_of_truth = "Case manifests with `conformance_claim = true`, `specs/variable_coverage.toml`, `specs/algorithm_ledger.toml`, and generated compare reports"
current_boundary = "Only promoted declared cases, variables, and meters listed through `docs/src/generated/conformance-case-index.md`; README and current-status prose are mirrors, not claim sources."

[[current_status_classification]]
id = "diagnostic-only"
source_of_truth = "Case manifests and diagnostic probes with `conformance_claim = false`, diagnostic output levels, and diagnostic reports"
current_boundary = "Useful source-order evidence, but never counted as a compatibility claim."

[[current_status_classification]]
id = "baseline-only"
source_of_truth = "EnergyPlus oracle baseline artifacts and output levels marked `baseline`"
current_boundary = "Oracle artifact extraction only; Rust numerical parity is not claimed."

[[current_status_classification]]
id = "not claimed"
source_of_truth = "`specs/project_contract.toml`, generated capability/coverage docs, and this document's Not Claimed section"
current_boundary = "Broad or full EnergyPlus, heat-balance, HVAC/node/meter, plant, sizing, EMS, PythonPlugin, AirflowNetwork, fenestration, infiltration, broad ExampleFiles, and broad IdealLoads compatibility remain outside current claims."
